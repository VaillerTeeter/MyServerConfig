# ==============================================================================
# 站点启用清单
# ------------------------------------------------------------------------------
# 职责: 决定 conf.d/sites/ 下哪些站点本次生效。
#   nginx.conf 末尾的 include /etc/nginx/conf.d/*.conf; 会收录本文件（*.conf 是
#   单层匹配，不进入 sites/ 子目录），所以站点文件只有被这里逐行 include 才生效。
# 用法: 启用/禁用只改本文件——注释掉一行即禁用，恢复该行即启用；被禁用的站点文件
#   仍保留在 conf.d/sites/ 下，随时可以改回来，不需要删除或搬动任何配置。
# 当前状态: 只有兜底站点 default-server 在运行（HTTP 给 444 直接断连、HTTPS 在 TLS 阶段
#   直接拒握手）；视频站 stream.conf 已就位但暂无内容；博客 / 网站导航 / 网盘 / 图库四个
#   站点尚未开始编写，对应文件已删除、启用行已注释，将来重建文件并放开该行即可。
# 生效方式: 改完在服务器上 nginx -s reload 即可（不必重建容器）；建议先执行
#   docker compose exec nginx nginx -t 验证，失败时 reload 会保留旧配置。
# ------------------------------------------------------------------------------
# 纪律:
#   1) 逐行写具体文件名，不要用 sites/*.conf 这类通配符: 一旦用通配符，控制权就
#      回到目录内容手里，本清单失去管控意义；反过来，这里引用的文件被删或改名会让
#      nginx -t 当场失败（open() failed: No such file or directory）——这是有意为之
#      的兜底，改动必须经过 CI。
#   2) 绝不要在本文件里 include /etc/nginx/conf.d/*.conf;（会把本文件自己再收一遍，
#      自我递归，启动直接报错）。
#   3) 同一行只能出现一次，也不要与通配符并存: 同一个 upstream / server 被加载两次，
#      nginx 会以 duplicate upstream 之类的错误拒绝启动。
#   4) 文件名一律小写 kebab-case。Windows 上大小写不敏感、Linux 上敏感，写错大小写
#      本地看不出问题，服务器上会直接失败。
#   5) 顺序即生效顺序。default-server 放在最前面: 它是 HTTP 侧 return 444; 与 HTTPS
#      侧 ssl_reject_handshake on; 的兜底站点，某个站点被禁用后，它的域名会落到这里，
#      而不是串到别的站点上去。
#   6) 空文件被 include 是合法的（等同没有任何配置），所以可以先登记、再填内容；
#      但"登记"与"开启"是两件事——没写完的站点保持注释状态，避免误以为已经上线。
# ==============================================================================

include /etc/nginx/conf.d/sites/default-server.conf;   # 兜底: 未知域名 444 / 拒握手
#include /etc/nginx/conf.d/sites/blog.conf;             # 博客
#include /etc/nginx/conf.d/sites/startpage.conf;        # 网站导航（起始页）
#include /etc/nginx/conf.d/sites/netdisk.conf;          # 网盘
#include /etc/nginx/conf.d/sites/gallery.conf;          # 图库
include /etc/nginx/conf.d/sites/stream.conf;           # 视频站（空文件，等同未上线）
