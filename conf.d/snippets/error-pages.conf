# ==============================================================================
# 片段: 统一错误页的落盘 location（被每个 server include）
# ------------------------------------------------------------------------------
# 用法: 在 server 块内 include 本文件——业务站点的 443 段、80 段，以及
#   conf.d/sites/default-server.conf 都各 include 一次，保证行为一致:
#   server {
#       ...
#       include      /etc/nginx/conf.d/snippets/error-pages.conf;
#   }
#
# 为什么需要它: nginx.conf 的 http 层只声明了「错误码 -> URI」的映射表，而那个 URI 必须
#   由某个 location 提供内容；location 不允许写在 http 层，所以每个 server 只能各放一份，
#   抽成片段是为了让五个站点的写法完全一致（否则改主题名要动五个文件）。
#   它与 nginx.conf 里的映射表是「成对」的: 少了它，内部跳转会落到不存在的文件上，
#   访客看到的仍然是 nginx 自带的 404 页面。
#
# 两行的含义:
#   root /etc/nginx/conf.d: conf.d/error 子模块随 ./conf.d 一起挂进容器，真实路径是
#     /etc/nginx/conf.d/error/<主题>/<代码>.html；因此 URI
#     /error/hacker-terminal/404.html 正好对应到该文件，一条前缀 location 覆盖该主题
#     下全部 20 张页面。
#   internal: 只允许「内部跳转」访问，访客不能把错误页当静态资源直接刷（省带宽与 CPU，
#     也避免错误页被当成站点内容收录）；外部直接访问该 URI 会得到 404。
#
# 注意: 本片段不声明 proxy_intercept_errors（那件事在 nginx.conf 的 http 层统一声明，
#   全站继承），也不添加任何 add_header——因为 add_header 一旦在子层出现，就会整体
#   取代父级（http 层）的那几条安全头，那正是 nginx.conf 3.7 段反复提醒的坑。
# ==============================================================================

location /error/ {
    internal;
    root /etc/nginx/conf.d;
}
