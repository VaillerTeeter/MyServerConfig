# ==============================================================================
# 片段: HTTP -> HTTPS 跳转（被各业务站点的 80 端口 server include）
# ------------------------------------------------------------------------------
# 用法: 在站点的 80 端口 server 内 include 本文件，站点自己只写 server_name，例如:
#   server {
#       include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
#       server_name  blog.example.example.example;
#   }
# 为什么做成片段: listen 与 return 不允许出现在 http 层，没法写进 nginx.conf 让所有
#   站点继承；抽成片段后「改一处、五个站点同时生效」，也避免各站点的写法慢慢漂移。
#
# 两行都放在这里、不放进站点文件，是因为它们对所有站点完全一致:
#   listen 80:          只写这一条即监听 IPv4 的 0.0.0.0:80；本仓库不使用 IPv6
#                       （域名不要配 AAAA 记录，否则 IPv6 访客会连接失败）。
#                       不要在这里写 default_server——全配置只能有一个，它由
#                       conf.d/sites/default-server.conf 占着。
#   return 301 ... $host: 301 是「永久移动」，浏览器会缓存，正式上线后不要随意更改；
#                       用 $host（请求头里的域名，已转小写、已去掉端口）而不是写死域名，
#                       这样将来加子域名只需在站点里补 server_name。
#                       另一点要知道: 301 会把非 GET/HEAD 的方法降级为 GET（请求体丢弃）。
#                       本仓库不做「用 http:// 提交表单或上传」的场景，因此可以接受。
#
# 组合效果: 任何用 http 访问本域名的请求都被 301 到同一域名的 https 地址；
#   而「没有被任何站点认领的域名」落到 default-server（444 直接断连），不会转到这里。
# ==============================================================================

listen       80;
return       301 https://$host$request_uri;
