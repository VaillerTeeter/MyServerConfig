# ==============================================================================
# Homepage 仪表盘 · 站点配置
# ------------------------------------------------------------------------------
# 职责: 把 homepage 仪表盘发布到公网。homepage 跑在本机（容器或宿主机进程），只监听
#   回环地址上的一个端口，本文件由 nginx 终结 TLS 并反向代理过去，HTTP 一律 301 到 HTTPS。
# 拓扑: 客户端 ──> nginx(443) ──> 127.0.0.1:3000 ──> homepage（同机进程，不经隧道）
#   若 homepage 在别的机器上，这里换成 frp 映射到服务器回环地址的那个端口。
#
# 使用说明（仓库里放的全是示例值，部署到服务器后按这几步做）:
#   1) 替换示例值:
#        server_name    homepage.example.example.example  → 真实域名（80 段、443 段各一处）
#        server         127.0.0.1:3000                   → homepage 的真实端口
#        proxy_redirect http://127.0.0.1:3000/           → 随端口一起改
#        ssl_certificate / ssl_certificate_key           → 真实证书（见下方证书约定）
#      替换之前是「合法但无效」的状态: nginx -t 能过、配置能加载，但本站点只对
#      homepage.example.example.example 生效，不会对外提供服务，也不影响其它域名。
#   2) homepage 侧配套（不在本文件里，缺了就不通）:
#      - 环境变量 HOMEPAGE_ALLOWED_HOSTS 必须包含本域名: homepage 会校验 Host 头，
#        不匹配时直接拒绝（页面显示 Invalid Host），与 TLS 无关
#      - 若 homepage 跑在别的机器上，frp 的 remote_port 只绑 127.0.0.1: 写成 0.0.0.0
#        会让 3000 端口被公网明文直连，绕过本文件的 TLS、安全头与错误页
#   3) 改完执行: docker compose exec nginx nginx -t，通过后 nginx -s reload。
#
# 证书约定: 一个域名一个目录 conf.d/cert/<域名>/，ssl_certificate 指向的必须是
#   「叶证书 + 中间证书」的完整链（只给叶证书时部分客户端会报不受信任）。
#   仓库里只提交 conf.d/cert/example/ 这份自签样例，真实证书目录不进版本库；
#   CI 也只准备了 example 那份，所以本站写的是 example 路径——既保证 CI 的
#   nginx -t 能过，也让部署时的替换点一目了然。
#
# 三条继承规则（与 nginx.conf 的 http 段联动，改本文件时最容易踩）:
#   1) 本文件里只要写了任意一条 proxy_set_header，http 段那 8 条会整体失效
#      （Host / Connection / Upgrade 全丢 → 上游 keepalive 与 WebSocket 都会坏），
#      所以下面那 8 条要么成套出现，要么一条都别写。
#   2) 只要写了任意一条 add_header，http 段那三条安全头会整体失效；所以这里把四条
#      安全头连同一行 X-Robots-Tag 成套重写，目的不是加一条，而是不让它们丢。
#   3) 只要写了任意一条 error_page，http 段那张统一错误页映射表在本站整体失效
#      （是取代、不是叠加）；本站依赖那张表把 404 与 429 换成主题页。
# ==============================================================================

# 上游连接池。作用域: http | 默认值: 无
# keepalive 系列必须写在 upstream 块内（写在 http 段无效），且要配合 nginx.conf 3.12
# 的 proxy_http_version 1.1 与清空 Connection 头，才会真正复用与上游的连接；
# 否则每个请求都要重新建一次到上游的 TCP 连接。
# 仪表盘尤其吃这个: 一次首屏要并发拉页面骨架、静态资源与每个 widget 的数据。
upstream homepage_upstream {
    server               127.0.0.1:3000;

    # 闲置保持的长连接数。默认值: 无（不写则不复用连接，每个请求新建）
    # 取 32: 按个人使用的并发量估，16-64 之间都合理。
    keepalive            32;
    # 单条上游连接最多复用多少次请求。默认值: 1000
    keepalive_requests   1000;
    # 单条上游连接最长存活。默认值: 1h（1.19.10+ 才有这条）
    keepalive_time       1h;
}

# 80 段: 把该域名的 HTTP 请求 301 到 HTTPS。
# 只写 include + server_name 两行——listen 80; 与 return 301 都在片段里，改一处即可
# 全站生效；片段里不含 default_server（全配置只能有一个，已由兜底站点占用）。
server {
    include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
    server_name  homepage.example.example.example;
}

# 443 段: 站点本体。
server {
    # 监听地址与端口。作用域: server | 默认值: *:80 | *:8000
    # 只监听 IPv4 的 0.0.0.0:443: 本仓库不使用 IPv6，域名也不要配 AAAA 记录，
    # 否则 IPv6 客户端会连接失败。
    listen               443 ssl;

    # 启用 HTTP/2。作用域: http/server | 默认值: off（1.25.1+ 才有这条指令）
    # 取 on: 首屏要并发拉取页面骨架、静态资源与各 widget 的数据，多路复用省掉往返。
    http2                on;

    server_name          homepage.example.example.example;

    # 证书与私钥。作用域: http/server | 默认值: 无
    # 部署时替换成 conf.d/cert/<域名>/ 下的真实文件（见文件头的证书约定）。
    ssl_certificate      /etc/nginx/conf.d/cert/example/example.example.example_bundle.crt;
    ssl_certificate_key  /etc/nginx/conf.d/cert/example/example.example.example.key;

    # 安全头。作用域: http/server/location | 默认值: 无
    # 这里写了任何一条，http 段那三条（nginx.conf 3.7）就整体失效，所以必须成套重写。
    # X-Frame-Options 沿用全局的 DENY: 仪表盘本身不需要被嵌进 iframe；若确实要把它
    #   嵌进别的面板，再改成 SAMEORIGIN（这条只管「本站被谁嵌套」，不影响本页内部
    #   用 iframe widget 去嵌第三方页面）。
    # HSTS 从 300 秒起步，确认长期可用 HTTPS 后再加长 max-age；不要随手加 preload。
    # X-Robots-Tag 只是对守规矩爬虫的礼貌请求，不是安全措施；它的价值是不让私人
    #   仪表盘被搜索引擎收录，从而少招来一批无差别的扫描与爆破尝试。
    add_header  X-Content-Type-Options nosniff always;
    add_header  Referrer-Policy no-referrer-when-downgrade always;
    add_header  X-Frame-Options DENY always;
    add_header  Strict-Transport-Security "max-age=300" always;
    add_header  X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass         http://homepage_upstream;

        # 这 8 条与 nginx.conf 3.12 声明的一致。写了任意一条就会整体取代 http 段那一份，
        # 缺哪条都可能断掉上游 keepalive 或 WebSocket 握手，所以必须成套出现。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 重写上游返回的重定向地址。作用域: http/server/location | 默认值: default
        # 这里必须显式写: proxy_pass 用的是 upstream 名，default 规则拿不到可匹配的
        #   「主机:端口」字符串，等于不生效。上游一旦吐出基于内网地址的绝对跳转，
        #   这一条会把它改写成相对路径，不会把访客送到 127.0.0.1。
        proxy_redirect     http://127.0.0.1:3000/ /;
    }

    # 本站刻意不加的调优（与 stream.conf 的差异，别照抄）:
    #   proxy_buffering off / client_max_body_size 0 / proxy_read_timeout 300s 都是
    #     视频流的专用取值；仪表盘是 HTML + JSON，沿用 http 段的缓冲、64m 上限与
    #     60s 超时更合适（缓冲让压缩与发送都更省，60s 足够单次页面与 widget 请求）。
    #   limit_req 也不启用: 首屏会并发几十个请求（每个 widget 一次数据），nginx.conf
    #     3.9 的 req_per_ip（20r/s）配 burst=50 很容易把自己人挡在门外。要防护就把
    #     burst 提到 100 以上，并先加 limit_req_dry_run on; 观察真实命中率。
    #
    # 统一错误页。映射表已在 nginx.conf 3.15 声明，这里只补「由谁把文件送出去」。
    include              /etc/nginx/conf.d/snippets/error-pages.conf;
}
