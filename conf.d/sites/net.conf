# ==============================================================================
# 外网站点反代（net）· 站点配置
# ------------------------------------------------------------------------------
# 职责: 用路径前缀把两个第三方 HTTPS 站点挂到自己的域名下。
#   https://<本站域名>/bgm/   ──>  https://api.bgm.tv/
#   https://<本站域名>/nyaa/  ──>  https://nyaa.si/
# 与其它站点的关键差异: 其余站点反代的都是服务器回环地址上的 frp 映射端口，
#   本文件反代的是公网域名，因此多出四组本地站点没有的配置——出站 TLS（SNI 与
#   证书校验）、路径前缀剥离、跳转改写、Cookie 改写。
# 拓扑: 客户端 ──> nginx(443) ──> api.bgm.tv:443 / nyaa.si:443（公网直连，不经隧道）
#
# 使用说明（仓库里放的全是示例值，部署到服务器后按这几步做）:
#   1) 替换示例值:
#        server_name           net.example.example.example  → 真实域名（80 段、443 段各一处）
#        ssl_certificate(_key) → 真实证书（见下方证书约定）
#        proxy_cookie_domain   末尾的替换值 → 与 server_name 保持一致
#      上游域名 api.bgm.tv / nyaa.si 是第三方公共服务地址，保留不改；若改用镜像站，
#      要同步改三处: upstream 里 server 的域名、location 里的 proxy_ssl_name、
#      以及 proxy_redirect 的匹配串。
#   2) 出网前提（不在本文件里，缺了只会得到 502）:
#      - 服务器必须能解析并直连这两个域名，先在服务器上验证:
#          curl -I https://api.bgm.tv/    与    curl -I https://nyaa.si/
#        不通时先解决出口问题，改配置没有意义（nyaa.si 在部分网络下存在 DNS 污染
#        与 TLS 阻断，需要海外出口）。
#      - 上游对来源 IP 有风控时（机房 IP 常见）会返回人机验证页，本文件不绕过它。
#   3) 改完执行: docker compose exec nginx nginx -t，通过后 nginx -s reload。
#
# 证书约定: 一个域名一个目录 conf.d/cert/<域名>/，ssl_certificate 指向的必须是
#   「叶证书 + 中间证书」的完整链（只给叶证书时部分客户端会报不受信任）。
#   仓库里只提交 conf.d/cert/example/ 这份自签样例，真实证书目录不进版本库；
#   CI 也只准备了 example 那份，所以本文件写的是 example 路径——既保证 CI 的
#   nginx -t 能过，也让部署时的替换点一目了然。
#
# 为什么用路径前缀而不是子域名: 同一个域名承载两个站点，靠 /bgm/ 与 /nyaa/ 区分，
#   不必为每个上游再申请一条 DNS 记录与一张证书。代价是上游页面里的根路径链接、
#   跳转与 Cookie 都落在本站域名下，必须逐项改写（见各 location 里的
#   proxy_redirect / proxy_cookie_* / sub_filter），漏一处就会把访客送回原站或 404。
#
# 三条继承规则（与 nginx.conf 的 http 段联动，改本文件时最容易踩）:
#   1) 本文件里只要写了任意一条 proxy_set_header，http 段那 8 条会整体失效
#      （Host / Connection / Upgrade 全丢 → 上游 keepalive 与 WebSocket 都会坏），
#      所以两个 location 里的 8 条都是成套重写的，并且 Host 换成了上游域名。
#   2) 只要写了任意一条 add_header，http 段那三条安全头会整体失效；所以下面把四条
#      安全头与一条 X-Robots-Tag 成套重写，目的不是加一条，而是不让它们丢。
#   3) 只要写了任意一条 error_page，http 段那张统一错误页映射表在本站整体失效
#      （是取代、不是叠加）；本站没有 error_page，只 include 落盘片段。
# ==============================================================================

# 上游连接池: api.bgm.tv。作用域: http | 默认值: 无
# 与本地站点的两处差别:
#   1) server 后面是公网域名，必须带 resolve: 不带时 nginx 只在启动与重载那一刻
#      解析一次，CDN 换 IP 后一直连旧地址；更麻烦的是启动阶段解析失败会让 nginx
#      直接起不来（其它站点跟着全挂）。带 resolve 后由 resolver（nginx.conf 3.16.1
#      的 1.1.1.1 / 8.8.8.8）在运行期解析，按 TTL 跟随变更，解析失败只影响这两条路径。
#   2) resolve 有两个硬前提: nginx 1.27.3+ 与 upstream 内的 zone，缺一个启动即报错。
upstream bgm_api_upstream {
    # 共享内存区。作用域: upstream | 默认值: 无（1.9.0+ 才有这条指令）
    # 取 64k: 官方口径每台服务器约占 128 字节，64k 对两条 upstream 绰绰有余；
    # 这段内存在所有 worker 之间共享，也是 resolve 动态改地址的落点。
    zone                 bgm_api_upstream 64k;

    # 上游地址。作用域: upstream | 默认值: 无
    # 端口必须显式写 443: 不写时默认 80，会连到对方的明文入口，与下面那组
    #   proxy_ssl_* 冲突（等于对 80 端口做 TLS 握手），表现为 502。
    server               api.bgm.tv:443 resolve;

    # 闲置保持的长连接数。默认值: 无（不写则不复用连接，每个请求新建）
    # 取 32: 个人使用量级，16-64 之间都合理；真正复用还依赖 nginx.conf 3.12 的
    #   proxy_http_version 1.1 与清空 Connection 头，本文件的 8 条里已经带上。
    keepalive            32;
    # 单条上游连接最多复用多少次请求。默认值: 1000
    keepalive_requests   1000;
    # 单条上游连接最长存活。默认值: 1h（1.19.10+ 才有这条）
    keepalive_time       1h;
}

# 上游连接池: nyaa.si。作用域: http | 默认值: 无
# 各项取值与上面的 bgm_api_upstream 完全一致（zone / resolve / keepalive 的理由见
# 那一段），只有域名不同。两个上游分开声明是因为地址与连接池必须互相独立，
# 一类的慢请求不该把另一类的连接占满。
upstream nyaa_upstream {
    zone                 nyaa_upstream 64k;
    server               nyaa.si:443 resolve;
    keepalive            32;
    keepalive_requests   1000;
    keepalive_time       1h;
}

# 80 段: 把该域名的 HTTP 请求 301 到 HTTPS。
# 只写 include + server_name 两行——listen 80; 与 return 301 都在片段里，改一处即可
# 全站生效；片段里不含 default_server（全配置只能有一个，已由兜底站点占用）。
server {
    include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
    server_name  net.example.example.example;
}

# 443 段: 站点本体。
server {
    # 监听地址与端口。作用域: server | 默认值: *:80 | *:8000
    # 只监听 IPv4 的 0.0.0.0:443: 本仓库不使用 IPv6，域名也不要配 AAAA 记录，
    # 否则 IPv6 客户端会连接失败。
    listen               443 ssl;

    # 启用 HTTP/2。作用域: http/server | 默认值: off（1.25.1+ 才有这条指令）
    # 取 on: 页面与接口都是「一串小请求」，多路复用省掉这批连接的往返。
    http2                on;

    server_name          net.example.example.example;

    # 证书与私钥。作用域: http/server | 默认值: 无
    # 部署时替换成 conf.d/cert/<域名>/ 下的真实文件（见文件头的证书约定）。
    ssl_certificate      /etc/nginx/conf.d/cert/example/example.example.example_bundle.crt;
    ssl_certificate_key  /etc/nginx/conf.d/cert/example/example.example.example.key;

    # 安全头。作用域: http/server/location | 默认值: 无
    # 这里写了任何一条，http 段那三条（nginx.conf 3.7）就整体失效，所以必须成套重写。
    # X-Frame-Options 沿用全局的 DENY: 两个上游都不需要被别的页面嵌套。
    # HSTS 从 300 秒起步，确认长期可用 HTTPS 后再加长 max-age；不要随手加 preload。
    # X-Robots-Tag: 反代的是第三方站点，本站域名不该被搜索引擎收录；它只是对守规矩
    #   爬虫的礼貌请求，不是安全措施。
    add_header  X-Content-Type-Options nosniff always;
    add_header  Referrer-Policy no-referrer-when-downgrade always;
    add_header  X-Frame-Options DENY always;
    add_header  Strict-Transport-Security "max-age=300" always;
    add_header  X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 客户端请求体上限。作用域: http/server/location | 默认值: 1m
    # 取 1m: 本站只转发查询与登录表单（没有上传），在全局 64m 的基础上收窄滥用面。
    client_max_body_size          1m;

    # 与上游建立连接的超时。作用域: http/server/location | 默认值: 60s
    # 取 10s: 上游在公网（可能跨境），比 http 段面向回环的 5s 放宽；又不像默认 60s
    #   那样让访客干等——连不上时尽快给出 502 主题页。
    proxy_connect_timeout         10s;

    # 是否拦截上游的错误响应。作用域: http/server/location | 默认值: off
    # 取 off（覆盖 http 段的 on）: 全局那张映射表会把上游的 4xx/5xx 换成主题 HTML，
    #   而 api.bgm.tv 的错误体是 JSON、nyaa.si 有自己的 404 页面，换掉都会破坏语义。
    # 关掉后主题页仍然有效——它只作用于 nginx 自己产生的错误（如 502、限流 429）。
    proxy_intercept_errors        off;

    # 请求速率限制。作用域: http/server/location | 默认值: 不限
    # zone 由 nginx.conf 3.9 定义（req_per_ip: 按来源 IP 20r/s），这里只负责启用。
    # burst=50 nodelay: /nyaa/ 一个页面会并发拉几十个静态资源，burst 太小会把自己人
    #   挡在门外（表现为偶发 429）；超出 burst 的部分立即拒绝，429 已由 nginx.conf
    #   3.15 的映射表换成主题页。想先观察阈值可临时加 limit_req_dry_run on;
    limit_req                     zone=req_per_ip burst=50 nodelay;

    # 出站 TLS 的四条公共设置，两个 location 共用。
    # SNI: 默认 off。不开时上游的 CDN 拿不到要访问的站点名，只能给默认证书或拒绝握手。
    proxy_ssl_server_name         on;
    # 校验证书: 默认 off。不开等于不设防，中间人可冒充上游（CI 的 SAST 也会直接拦）。
    proxy_ssl_verify              on;
    # 校验链深度: 默认 1。取 3 以容纳「叶证书 + 多层中间证书」的常见 CDN 证书链。
    proxy_ssl_verify_depth        3;
    # 受信 CA 包: 用镜像自带的系统根证书。nginx:stable 与 nginx:alpine 都随
    #   ca-certificates 提供 /etc/ssl/certs/ca-certificates.crt，CI 里也能读到。
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # 屏蔽上游的响应头。作用域: http/server/location | 默认值: 无（默认只隐藏
    #   Server / Date / X-Pad / X-Accel-*，其余全部原样透传）
    # 后四条: 上游也会发同名安全头，与上面的 add_header 重名会变成两条、浏览器行为
    #   不确定；何况上游的 HSTS 策略（max-age、preload）并不属于本站域名。
    # Alt-Svc: 上游 CDN 会宣告 HTTP/3。原样透传后访客会尝试用 HTTP/3 连「本站域名」，
    #   而本机并没有开启它，只会增加失败与重试。
    proxy_hide_header             Alt-Svc;
    proxy_hide_header             Strict-Transport-Security;
    proxy_hide_header             X-Frame-Options;
    proxy_hide_header             X-Content-Type-Options;
    proxy_hide_header             Referrer-Policy;

    # 精确匹配 /bgm（不带结尾斜杠）。作用域: location | 默认值: 无
    # 前缀匹配的 /bgm/ 不会命中 /bgm，不写这段访客会拿到 404；301 补上斜杠即可。
    # 用相对地址（/bgm/）是为了不写死 http/https 与域名。
    location = /bgm {
        return 301 /bgm/;
    }

    # /bgm/ 反代到 api.bgm.tv。作用域: location | 默认值: 无
    # proxy_pass 末尾那个 / 是路径剥离的关键: nginx 会把 location 匹配到的前缀 /bgm/
    #   替换成 proxy_pass 里的 URI（这里是 /），于是 /bgm/v0/subjects/2 变成
    #   /v0/subjects/2。漏掉末尾的斜杠就不剥前缀，上游会收到 /bgm/v0/... 并返回 404。
    location /bgm/ {
        proxy_pass https://bgm_api_upstream/;

        # 这 8 条与 nginx.conf 3.12 声明的一致。写了任意一条就会整体取代 http 段那一份，
        # 缺哪条都可能断掉上游 keepalive 或 WebSocket 握手，所以必须成套出现。
        # 与本地站点的两处差异: Host 换成上游域名（对端按它路由到对应站点）；
        #   X-Real-IP 与 X-Forwarded-* 全部置空——空字符串表示不发送该头，第三方站点
        #   不需要访客 IP，也没有理由让它知道本站域名与访客来源。
        proxy_set_header   Host              api.bgm.tv;
        proxy_set_header   X-Real-IP         "";
        proxy_set_header   X-Forwarded-For   "";
        proxy_set_header   X-Forwarded-Proto "";
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   X-Forwarded-Port  "";
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 出站 TLS 用的 SNI 名与证书校验名。作用域: http/server/location
        # 默认值: $proxy_host（在 upstream 形式下取值是 upstream 组名），拿组名去握手
        #   与校验证书必然失败，所以必须显式写上游域名。开关本身在 server 段
        #   （proxy_ssl_server_name 与 proxy_ssl_verify），这里只决定「用哪个名字」。
        proxy_ssl_name     api.bgm.tv;

        # 重写上游返回的跳转地址。作用域: http/server/location | 默认值: default
        # default 规则按 proxy_pass 里的主机名匹配，用了 upstream 组名就匹配不上，
        #   等于不生效；而且它只管与 proxy_pass 对应的绝对地址。三条一起写才完整:
        #   前两条覆盖 https/http 绝对跳转，第三条 / 覆盖相对跳转（Location: /v0/xxx），
        #   否则访客会被送到本站根路径而不是 /bgm/ 下。
        proxy_redirect     https://api.bgm.tv/ /bgm/;
        proxy_redirect     http://api.bgm.tv/ /bgm/;
        proxy_redirect     / /bgm/;
    }

    # 精确匹配 /nyaa（不带结尾斜杠），理由同上面的 /bgm。
    location = /nyaa {
        return 301 /nyaa/;
    }

    # /nyaa/ 反代到 nyaa.si。作用域: location | 默认值: 无
    # 末尾的 / 同样负责剥前缀: /nyaa/view/123 → /view/123。
    location /nyaa/ {
        proxy_pass https://nyaa_upstream/;

        # 这 8 条与 nginx.conf 3.12 声明的一致，理由同 /bgm/ 那一段
        # （Host 换成上游域名、X-Real-IP 与 X-Forwarded-* 置空）。
        proxy_set_header   Host              nyaa.si;
        proxy_set_header   X-Real-IP         "";
        proxy_set_header   X-Forwarded-For   "";
        proxy_set_header   X-Forwarded-Proto "";
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   X-Forwarded-Port  "";
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # 第 9 条，只在本 location 出现: 清空 Accept-Encoding 让上游回明文，供下面
        #   sub_filter 改页面；压缩交回给 http 段 3.8 的 gzip 统一处理（gzip_proxied any
        #   保证上游响应也会被压缩）。sub_filter 不处理压缩过的响应，不清空就静默失效。
        proxy_set_header   Accept-Encoding   "";

        # SNI 与证书校验名，理由同 /bgm/。
        proxy_ssl_name     nyaa.si;

        # 跳转改写，理由同 /bgm/（上游若返回绝对或相对跳转，都要拉回 /nyaa/ 前缀）。
        proxy_redirect     https://nyaa.si/ /nyaa/;
        proxy_redirect     http://nyaa.si/ /nyaa/;
        proxy_redirect     / /nyaa/;

        # 改写上游 Set-Cookie 的域。作用域: http/server/location | 默认值: off
        # 上游下发的 Cookie 带 Domain=.nyaa.si，浏览器在「本站域名」下会直接丢弃它，
        #   表现为验证页反复重来、登录状态存不住。正则同时覆盖 nyaa.si 与 .nyaa.si
        #   两种写法；替换值必须与本文件的 server_name 一致。
        proxy_cookie_domain ~^\.?nyaa\.si$ net.example.example.example;

        # 改写上游 Set-Cookie 的路径。作用域: http/server/location | 默认值: off
        # 上游写的是 Path=/，不收窄的话这些 Cookie 会被一并带到 /bgm/ 下；改成
        #   /nyaa/ 之后只在本路径内收发。
        proxy_cookie_path   / /nyaa/;

        # 页面内链接改写。作用域: http/server/location | 默认值: 无
        # 上游页面用的是根路径（href="/view/…"），原样返回时浏览器会去请求本站的
        #   /view/… 而不是 /nyaa/view/…，点任何链接都 404，所以按属性类型补前缀。
        # sub_filter_once off: 整页所有出现都替换（默认 on 只替换第一处）。
        # 限制: 默认只处理 text/html；字面替换不支持正则，页面里若出现协议相对地址
        #   （//host/x）也会被误加前缀——上游换版式或接入静态资源域名时要复核这一段。
        sub_filter_once    off;
        sub_filter         'href="/'   'href="/nyaa/';
        sub_filter         'src="/'    'src="/nyaa/';
        sub_filter         'action="/' 'action="/nyaa/';
        sub_filter         'https://nyaa.si/' '/nyaa/';
        sub_filter         'http://nyaa.si/'  '/nyaa/';
    }

    # 统一错误页。映射表已在 nginx.conf 3.15 声明，这里只补「由谁把文件送出去」。
    # 本站关掉了 proxy_intercept_errors，所以主题页只覆盖 nginx 自身产生的错误
    # （如 502、限流 429），上游自己的错误页与 JSON 错误体原样透传。
    include              /etc/nginx/conf.d/snippets/error-pages.conf;
}
