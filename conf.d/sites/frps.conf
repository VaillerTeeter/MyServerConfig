# ==============================================================================
# frps 管理面板（Web 控制台）· 站点配置
# ------------------------------------------------------------------------------
# 职责: 把 frps 自带的 Web 控制台安全地暴露到公网。frps 与 nginx 同机，控制台只监听
#   回环地址，本文件由 nginx 终结 TLS 并反向代理过去，HTTP 一律 301 到 HTTPS。
# 拓扑: 客户端 ──> nginx(443) ──> 127.0.0.1:7500 ──> frps 控制台（同机进程，不经隧道）
#
# 使用说明（仓库里放的全是示例值，部署到服务器后按这几步做）:
#   1) 替换示例值:
#        server_name    frps.example.example.example   → 真实域名（80 段、443 段各一处）
#        server         127.0.0.1:7500                 → frps 控制台的真实端口
#        proxy_redirect http://127.0.0.1:7500/         → 随端口一起改
#        ssl_certificate / ssl_certificate_key         → 真实证书（见下方证书约定）
#      替换之前是「合法但无效」的状态: nginx -t 能过、配置能加载，但本站点只对
#      frps.example.example.example 生效，不会对外提供服务，也不影响其它域名。
#   2) frps 侧配套（不在本文件里，缺了就不安全）:
#      - webServer.addr 保持 127.0.0.1: 写成 0.0.0.0 会让控制台被公网明文直连，
#        绕过本文件的 TLS、安全头与限流
#      - webServer.user / webServer.password: 必须改掉官方示例的 admin/admin
#      - webServer.port: 不设就不启动控制台；本文件的 7500 是官方示例值，按实际改
#      - enablePrometheus = true 会在同一个监听上多出 /metrics（见下方 location）
#      - webServer.tls.* 若开启，frps 上游本身就是 https，本文件要改用 https:// 并补
#        proxy_ssl_* 指令
#   3) 改完执行: docker compose exec nginx nginx -t，通过后 nginx -s reload。
#
# 证书约定: 一个域名一个目录 conf.d/cert/<域名>/，ssl_certificate 指向的必须是
#   「叶证书 + 中间证书」的完整链（只给叶证书时部分客户端会报不受信任）；
#   仓库里只提交 conf.d/cert/example/ 这份自签样例，真实证书目录不进版本库。
#
# 三条继承规则（与 nginx.conf 的 http 段联动，改本文件时最容易踩）:
#   1) 本文件里只要写了任意一条 proxy_set_header，http 段那 8 条会整体失效
#      （Host / Connection / Upgrade 全丢 → 上游 keepalive 与 WebSocket 都会坏），
#      所以那 8 条要么成套出现，要么一条都别写。
#   2) 只要写了任意一条 add_header，http 段那三条安全头会整体失效；所以这里把四条
#      安全头与一条 X-Robots-Tag 成套重写，目的不是加一条，而是不让它们丢。
#   3) 只要写了任意一条 error_page，http 段那张统一错误页映射表在本站整体失效
#      （是取代、不是叠加）；本站依赖那张表把 404 与 429 换成主题页。
# ==============================================================================

# 上游连接池。作用域: http | 默认值: 无
# keepalive 系列必须写在 upstream 块内（写在 http 段无效），且要配合 nginx.conf 3.12
# 的 proxy_http_version 1.1 与清空 Connection 头，才会真正复用与上游的连接。
# 这里的「上游」是同一台机器上的 frps 进程，不经 frp 隧道；控制台又是「一串小请求」
# （页面骨架、静态资源、每几秒一次的 API 轮询），复用能省掉每个请求一次 TCP 握手。
upstream frps_upstream {
    server              127.0.0.1:7500;

    # 闲置保持的长连接数。默认值: 无（不写则不复用连接，每个请求新建）
    # 取 32: 控制台并发很低，16-64 之间都合理。
    keepalive           32;
    # 单条上游连接最多复用多少次请求。默认值: 1000
    keepalive_requests  1000;
    # 单条上游连接最长存活。默认值: 1h（1.19.10+ 才有这条）
    keepalive_time      1h;
}

# 80 段: 把该域名的 HTTP 请求 301 到 HTTPS。
# 只写 include + server_name 两行——listen 80; 与 return 301 都在片段里，改一处即可
# 全站生效；片段里不含 default_server（全配置只能有一个，已由兜底站点占用）。
# 这一跳对管理面板尤其重要: 访客用 http 打开时先拿到 301，登录动作不会留在明文链路上。
server {
    include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
    server_name  frps.example.example.example;
}

# 443 段: 站点本体。
server {
    # 监听地址与端口。作用域: server | 默认值: *:80 | *:8000
    # 只监听 IPv4 的 0.0.0.0:443: 本仓库不使用 IPv6，域名也不要配 AAAA 记录，
    # 否则 IPv6 客户端会连接失败。
    listen               443 ssl;

    # 启用 HTTP/2。作用域: http/server | 默认值: off（1.25.1+ 才有这条指令）
    # 取 on: 控制台首屏要并发拉十几个静态资源与 API 响应，多路复用省掉这批连接往返。
    http2                on;

    server_name          frps.example.example.example;

    # 证书与私钥。作用域: http/server | 默认值: 无
    # 部署时替换成 conf.d/cert/<域名>/ 下的真实文件（见文件头的证书约定）。
    ssl_certificate      /etc/nginx/conf.d/cert/example/example.example.example_bundle.crt;
    ssl_certificate_key  /etc/nginx/conf.d/cert/example/example.example.example.key;

    # 安全头。作用域: http/server/location | 默认值: 无
    # 这里写了任何一条，http 段那三条（nginx.conf 3.7）就整体失效，所以必须成套重写。
    # X-Frame-Options 沿用全局的 DENY: 面板没有任何要嵌进 iframe 的场景，DENY 能挡
    #   点击劫持——管理动作不该出现在别的页面上。
    # HSTS 从 300 秒起步，确认长期可用 HTTPS 后再加长 max-age；不要随手加 preload。
    # X-Robots-Tag 只是对守规矩爬虫的礼貌请求，不是安全措施；它的价值是不让面板被
    #   搜索引擎收录，从而少招来一批无差别的扫描与爆破尝试。
    add_header  X-Content-Type-Options nosniff always;
    add_header  Referrer-Policy no-referrer-when-downgrade always;
    add_header  X-Frame-Options DENY always;
    add_header  Strict-Transport-Security "max-age=300" always;
    add_header  X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass         http://frps_upstream;

        # 这 8 条与 nginx.conf 3.12 声明的一致。写了任意一条就会整体取代 http 段那一份，
        # 缺哪条都可能断掉上游 keepalive 或 WebSocket 握手，所以必须成套出现。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # 重写上游返回的重定向地址。作用域: http/server/location | 默认值: default
        # 这里必须显式写: proxy_pass 用的是 upstream 名，default 规则拿不到可匹配的
        #   「主机:端口」字符串，等于不生效。
        proxy_redirect     http://127.0.0.1:7500/ /;
        # 请求速率限制。作用域: http/server/location | 默认值: 不限
        # zone 由 nginx.conf 3.9 定义（req_per_ip: 10m 共享内存、按来源 IP 20r/s），
        #   本文件只负责「启用」；同名 zone 是全局共享的，这里再定义一次没有意义。
        # burst=50 nodelay: 面板首屏会一次并发十几个请求，burst 太小会把自己人挡在门外
        #   （表现为偶发 429）；超出 burst 的部分立即拒绝，429 已被 nginx.conf 3.15
        #   的映射表换成主题页。想先观察阈值合不合适，可加一行 limit_req_dry_run on;
        #   只统计不拦截（见 nginx.conf 3.9）。
        limit_req          zone=req_per_ip burst=50 nodelay;

    }

    # 隐藏 Prometheus 指标端点。作用域: location | 默认值: 无
    # frps 的 enablePrometheus = true 会在同一个监听上多出 /metrics（暴露全部代理、
    #   流量与连接数），而 location / 是整段反代，等于把它一起送到公网。
    # 用精确匹配 + return 404（而不是 deny all 的 403）: 连「存在但被拒绝」都不告诉对方。
    # 它与 location / 是并列的，不继承那里的限流，所以这条 404 不会被 req_per_ip 计数。
    location = /metrics {
        return 404;
    }

    # 统一错误页。映射表已在 nginx.conf 3.15 声明，这里只补「由谁把文件送出去」。
    include              /etc/nginx/conf.d/snippets/error-pages.conf;
}
