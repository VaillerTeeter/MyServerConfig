# ==============================================================================
# 兜底站点（default-server）
# ------------------------------------------------------------------------------
# 职责: 承接所有「没有被任何业务站点认领」的请求——裸 IP、错拼域名、扫描器，
#   以及将来某个站点被禁用后留下的域名。它本身不承载任何业务。
#
# 与其他站点文件的关系（重要）:
#   1) 本文件有两部分: 上面是兜底站点（生效中），末尾是通用站点基底（整段注释、
#      不参与运行）。nginx 的 server 块之间没有任何继承关系，include 只是把文本
#      嵌进来，所以本文件不会影响任何业务站点。
#      所有站点共用的行为只来自两处: nginx.conf 的 http 段（自动继承，例如统一错误页
#      映射表、安全头、压缩），以及 conf.d/snippets/*.conf（各站点主动 include 的片段）。
#   2) 本文件必须排在 include 的最前面（见 conf.d/sites.conf 第 1 行）:
#      谁占住 default_server，谁就是「陌生域名」的最终归宿。
#
# 设计取舍: HTTP 侧 444、HTTPS 侧拒握手，两者都不返回任何内容。
#   - 不做 HTTP -> HTTPS 的 301: 落到这里的域名都是「不认识的名字」，把 301 指向
#     https://<同名的错名字> 只会让访客紧接着撞上下面的拒握手、看到证书错误；
#     干净断开比错误跳转更合适。真正的 301 在每个业务站点自己的 80 段里
#     （见 conf.d/snippets/redirect-to-https.conf）。
#   - 不为陌生域名提供主题错误页: 错误页是给认领过的域名用的服务质量，不是给扫描器看的。
#     唯一例外是 nginx 自己产生的 400（畸形请求）——那种情况仍会落到本 server，
#     所以本文件 80 段也 include 了错误页 location 片段。
#
# 生效方式: 服务器上执行 docker compose exec nginx nginx -t 验证，通过后 nginx -s reload
#   （reload 失败会保留旧配置，不会中断服务）。
# ==============================================================================

# HTTP 兜底。作用域: server | 无默认值（不写 listen 的 server 不会被任何请求命中）
# listen 80 default_server: 声明本 server 是 80 端口上的默认虚拟主机。
#   同一个 地址:端口 全配置只能出现一个 default_server，写重了启动直接报
#   duplicate default server；业务站点写 listen 80;（不带该参数）即可。
#   只监听 IPv4: 本仓库不使用 IPv6，域名也不要配 AAAA 记录，否则 IPv6 客户端连不上。
# return 444: nginx 自定义状态码（官方源码注释为 "The special code to close connection
#   without any response"），语义是不发送任何响应、直接关闭连接，浏览器显示「连接被重置」。
#   它仍会进访问日志，状态码字段就是 444，想统计被扫了多少次可以
#   grep ' 444 ' /var/log/nginx/access.log，所以本段不关访问日志。
server {
    listen               80 default_server;
    server_name          _;
    return               444;

    # nginx 自己产生的 400 会落到本 server，带上这个片段才能用主题错误页
    include              /etc/nginx/conf.d/snippets/error-pages.conf;
}

# HTTPS 兜底。作用域: server
# listen 443 ssl default_server: 443 端口上的默认虚拟主机，必须带 ssl 参数，
#   否则 ssl_reject_handshake 无从生效。
# ssl_reject_handshake on（1.19.4+）: 在 TLS 握手阶段就拒绝，客户端连证书都拿不到，
#   自然也就看不到任何域名信息（这是它优于「先给一张自签证书再返回 444」的地方）。
#   开启后本 server 不需要也不该配 ssl_certificate: 不完成握手，就没有证书可用。
#   代价: 访客用 https 访问错拼域名会看到证书错误，这是预期行为。
# 注意: 本段不受 nginx.conf 错误页映射表的影响——TLS 阶段就结束了，没有 HTTP 响应可换页；
#   同理 HTTP 侧那次 444 也不会有错误页（444 没有响应体）。
server {
    listen               443 ssl default_server;
    server_name          _;
    ssl_reject_handshake on;
}

# ==============================================================================
# 通用站点基底（整段注释，仅作书写范本，不参与运行）
# ------------------------------------------------------------------------------
# 定位: 所有站点的基座——只包含每个站点都必需的部分，不含任何站点专属项。
#   新站点从这份配置复制一份出去，替换全部 <占位值>，再在下面「站点自己的指令」
#   那一行之后，按该站点的需要增删。
# 用法: 复制整段 → conf.d/sites/<站点名>.conf（文件名全小写 kebab-case）
#   → 替换全部 <占位值> → 在 conf.d/sites.conf 里放开对应 include 行
#   → docker compose exec nginx nginx -t 通过后 nginx -s reload。
# 注意: 占位值没替换完之前不要把注释放开，否则 nginx -t 会因取值非法直接失败。
# 三条继承规则（与 nginx.conf 的 http 段联动，最容易踩）:
#   1) 只要写了任意一条 proxy_set_header，http 段那 8 条会整体失效
#      （Host / Connection / Upgrade 全丢 → 上游 keepalive 与 WebSocket 都会坏），
#      所以下面那 8 条要么成套出现，要么一条都别写。
#   2) 只要写了任意一条 add_header，http 段那三条安全头会整体失效；
#      补 HSTS 时必须把三条一起重写。
#   3) 只要写了任意一条 error_page，http 段那张统一错误页映射表在本站整体失效
#      （是取代、不是叠加），不要为了改一个码把整表抄一遍。
# ==============================================================================

# 上游连接池: 本地上游经 frp 内网穿透后，只在服务器回环地址上监听的那个端口。
# keepalive 必须在 upstream 块内声明（写在 http 段无效），它要配合全局的
# proxy_http_version 1.1 与清空 Connection 头，才会真正复用与上游的连接，
# 否则每个请求都要重新穿一次隧道建连接。
#upstream <站点名>_upstream {
#    server              127.0.0.1:<端口>;     # ← frp 映射端口
#    keepalive           32;                   # 闲置保持的长连接数（按并发 16-64 取）
#    keepalive_requests  1000;                 # 单条连接最多复用多少次请求
#    keepalive_time      1h;                   # 单条连接最长存活（1.19.10+）
#}

# 80 段: HTTP 一律 301 到 HTTPS。listen 与 return 都在片段里，这里只写两行。
#server {
#    include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
#    server_name  <域名>;
#}

