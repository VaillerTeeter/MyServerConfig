#   「叶证书 + 中间证书」的完整链（只给叶证书时部分客户端会报不受信任）。
#   仓库里只有 conf.d/cert/example/ 这份自签样例；真实证书目录不进版本库，
#   CI 也只准备了 example 那份，因此站点里写真实证书路径会让 CI 的 nginx -t
