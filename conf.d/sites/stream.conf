# ==============================================================================
# 视频站（Emby）· 站点配置
# ------------------------------------------------------------------------------
# 职责: 承接公网对 Emby 的访问。本地 Emby 经 frp 内网穿透后只在服务器回环地址上
#   监听一个端口，本文件由 nginx 终结 TLS 并反向代理过去，HTTP 一律 301 到 HTTPS。
# 拓扑: 客户端 ──> nginx(443) ──> 127.0.0.1:<真实端口> ──> frpc ──> 本地 Emby
#
# 使用说明（仓库里放的全是示例值，部署到服务器后按这三步做）:
#   1) 替换示例值:
#        server_name    stream.example.example.example   → 真实域名（80 段、443 段各一处）
#        server         127.0.0.1:9005                   → frp 映射到服务器的真实端口
#        proxy_redirect http://127.0.0.1:9005/           → 随端口一起改
#        ssl_certificate / ssl_certificate_key           → 真实证书（见下方证书约定）
#      替换之前是「合法但无效」的状态: nginx -t 能过、配置能加载，但本站点只对
#      stream.example.example.example 生效，不会对外提供服务，也不影响其它域名。
#   2) 服务器侧配套（不在本文件里，缺了就不通）:
#      - frp 的 remote_port 只绑 127.0.0.1: 否则 Emby 会被公网明文直连，绕过本文件
#      - Emby 后台「网络」→ Secure connection mode 设为 Handled by reverse proxy，
#        再把 127.0.0.1 加入 Known proxies: 否则播放会话与日志里的客户端 IP 全是错的
#   3) 改完执行: docker compose exec nginx nginx -t，通过后 nginx -s reload。
#
# 证书约定: 一个域名一个目录 conf.d/cert/<域名>/，ssl_certificate 指向的必须是
#   「叶证书 + 中间证书」的完整链（只给叶证书时部分客户端会报不受信任）；
#   仓库里只提交 conf.d/cert/example/ 这份自签样例，真实证书目录不进版本库。
#
# 三条继承规则（与 nginx.conf 的 http 段联动，改本文件时最容易踩）:
#   1) 本文件里只要写了任意一条 proxy_set_header，http 段那 8 条会整体失效
#      （Host / Connection / Upgrade 全丢 → 上游 keepalive 与 WebSocket 都会坏），
#      所以那 8 条要么成套出现，要么一条都别写（location /embywebsocket 就是后者）。
#   2) 只要写了任意一条 add_header，http 段那三条安全头会整体失效。
#   3) 只要写了任意一条 error_page，http 段那张统一错误页映射表在本站整体失效
#      （是取代、不是叠加）。
# ==============================================================================

# 上游连接池。作用域: http | 默认值: 无
# keepalive 系列必须写在 upstream 块内（写在 http 段无效），且要配合 nginx.conf 3.12
# 的 proxy_http_version 1.1 与清空 Connection 头，才会真正复用与上游的连接；
# 否则每个请求都要重新穿一次 frp 隧道建连接，延迟与开销都白涨。
upstream stream_upstream {
    server               127.0.0.1:9005;

    # 闲置保持的长连接数。默认值: 无（不写则不复用连接，每个请求新建）
    # 取 32: 按播放期的并发量估，16-64 之间都合理。
    keepalive            32;
    # 单条上游连接最多复用多少次请求。默认值: 1000
    keepalive_requests   1000;
    # 单条上游连接最长存活。默认值: 1h（1.19.10+ 才有这条）
    keepalive_time       1h;
}

# 80 段: 把该域名的 HTTP 请求 301 到 HTTPS。
# 只写 include + server_name 两行——listen 80; 与 return 301 都在片段里，改一处即可
# 全站生效；片段里不含 default_server（全配置只能有一个，已由兜底站点占用）。
server {
    include      /etc/nginx/conf.d/snippets/redirect-to-https.conf;
    server_name  stream.example.example.example;
}

# 443 段: 站点本体。
server {
    # 监听地址与端口。作用域: server | 默认值: *:80 | *:8000
    # 只监听 IPv4 的 0.0.0.0:443: 本仓库不使用 IPv6，域名也不要配 AAAA 记录，
    # 否则 IPv6 客户端会连接失败。
    listen               443 ssl;

    # 启用 HTTP/2。作用域: http/server | 默认值: off（1.25.1+ 才有这条指令）
    # 取 on: Emby 控制台会并发大量小请求（媒体列表、缩略图、进度上报），多路复用收益明显。
    http2                on;

    server_name          stream.example.example.example;

    # 证书与私钥。作用域: http/server | 默认值: 无
    # 部署时替换成 conf.d/cert/<域名>/ 下的真实文件（见文件头的证书约定）。
    ssl_certificate      /etc/nginx/conf.d/cert/example/example.example.example_bundle.crt;
    ssl_certificate_key  /etc/nginx/conf.d/cert/example/example.example.example.key;

    # 安全头。作用域: http/server/location | 默认值: 无
    # 这里写了任何一条，http 段那三条（nginx.conf 3.7）就整体失效，所以四条必须成套出现。
    # X-Frame-Options 取 SAMEORIGIN 而不是全局的 DENY: Emby 界面有同源 iframe 的场景，
    #   DENY 连同源都禁止、会把它们打掉；SAMEORIGIN 仍能挡点击劫持。
    # HSTS 从 300 秒起步，确认长期可用 HTTPS 后再加长 max-age；不要随手加 preload。
    add_header  X-Content-Type-Options nosniff always;
    add_header  Referrer-Policy no-referrer-when-downgrade always;
    add_header  X-Frame-Options SAMEORIGIN always;
    add_header  Strict-Transport-Security "max-age=300" always;

    # 响应缓冲。作用域: http/server/location | 默认值: on
    # 取 off: 视频/转码/HLS 必须边到边发——开着会等缓冲攒满才发给播放器，还会把大响应
    #   落到临时文件（http 段的 proxy_max_temp_file_size 128m 就白设了）。
    proxy_buffering       off;

    # 客户端请求体上限。作用域: http/server/location | 默认值: 1m
    # 取 0（不限制）: Emby 的字幕、封面、插件包、Sync 回传媒体都会超过 http 段的 64m。
    client_max_body_size  0;

    # 等上游响应、向上游发送、向客户端发送的超时。作用域: http/server/location
    # 默认值: 三者都是 60s（send_timeout 全局取的是 30s，见 nginx.conf 3.4）
    # 取 300s: 转码要先探测再出首帧，60s 偏紧；播放器暂停时不再读 socket，
    #   send_timeout 太短会把连接掐掉（表现为恢复播放时卡顿或重连）。
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    send_timeout          300s;

    location / {
        proxy_pass         http://stream_upstream;

        # 这 8 条与 nginx.conf 3.12 声明的一致。写了任意一条就会整体取代 http 段那一份，
        # 缺哪条都可能断掉上游 keepalive 或 WebSocket 握手，所以必须成套出现。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 重写上游返回的重定向地址。作用域: http/server/location | 默认值: default
        # 这里必须显式写: proxy_pass 用的是 upstream 名，default 规则拿不到可匹配的
        #   「主机:端口」字符串，等于不生效。写上它，Emby 万一发出内网绝对地址也能被
        #   改写成相对路径，不会把访客重定向到 127.0.0.1。
        proxy_redirect     http://127.0.0.1:9005/ /;
    }

    # Emby 的实时通道: 播放控制、进度上报、远程投屏、库刷新都走这个路径。
    # 刻意不写 proxy_set_header: 全部继承 http 段那 8 条（含 Upgrade 与
    #   $connection_upgrade）；一旦在这里写任何一条，那 8 条会整体失效。
    # 两个超时取 3600s: 播放空闲时这条长连接会长时间没有数据，用全局的 60s 会被切断。
    location /embywebsocket {
        proxy_pass           http://stream_upstream;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # 统一错误页。映射表已在 nginx.conf 3.15 声明，这里只补「由谁把文件送出去」。
    include              /etc/nginx/conf.d/snippets/error-pages.conf;
}
