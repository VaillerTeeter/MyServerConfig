# ==============================================================================
# MyNginx 主配置 · 通用部分
# ------------------------------------------------------------------------------
# 职责范围: 进程模型、连接模型，以及所有转发站点共用的 http 公共默认值。
# 本文件不承载业务: upstream / server / location / 证书路径全部由 conf.d/*.conf
# 提供（见文件末尾的 include），因此单独一份本文件即可通过 nginx -t。
#
# 运行拓扑（所有站点共用同一条链路）:
#   客户端 ──> nginx(公网 80/443) ──> 127.0.0.1:<frp 映射端口> ──> frpc ──> 本地站点
#   本地站点经内网穿透后只监听服务器回环地址，nginx 是唯一公网入口，
#   TLS、压缩、限流、真实客户端 IP、大文件与流媒体特性都在这里统一处理。
#
# 日志结构（全配置只有两处，改日志只需看这两处）:
#   - 错误日志: main 段的 error_log（落盘 + 同时输出到容器 stdout），全配置自动继承；
#   - 访问日志: http 段的 3.2，全站收成一条，靠格式里的 vhost= / host= 字段区分站点。
# ==============================================================================

# ------------------------------------------------------------------------------
# 一、main 全局块（进程与运行环境）
# ------------------------------------------------------------------------------

# 运行用户。作用域: main | 默认值: nobody
# 取 nginx: 与发行版软件包、官方镜像预置的系统用户一致，避免权限与 pid 归属问题。
user                  nginx;

# 工作进程数。作用域: main | 默认值: 1
# 取 auto: 反向代理属 IO 密集型，按 CPU 核数起进程即可，多起无收益。
worker_processes      auto;

# 单进程可打开的文件描述符上限。作用域: main | 默认值: 继承启动环境
# 取 65535: 代理场景每个连接至少占 2 个 fd（客户端与上游各一），必须大于等于
# worker_connections 的两倍；宿主机 systemd 或容器的 LimitNOFILE 需同步放开，
# 否则实际生效值取两者中的较小者。
worker_rlimit_nofile  65535;

# 错误日志的落盘路径与级别。作用域: main | 默认值: logs/error.log，级别 error
# 日志结构: 错误日志在本段（落盘 + 同时进容器 stdout），访问日志集中在 http 段 3.2。
# 在 main 声明后即由 http/server/location 继承，所以 http 段不再重复声明；
# 只写文件的话，运行期错误只能进服务器 grep，多下面那条 stderr 才能用容器日志直接看。
# 取 warn: 上线后只关心真实异常，notice 级别的重载与上游探测信息会淹没日志；
# 排障时临时改为 notice 或 info 即可，无需改动其他指令。
error_log             /var/log/nginx/error.log warn;

# 第二条错误日志，输出到容器的标准错误。作用域: main | 默认值: 无
# 同一层可同时声明多条 error_log（1.5.2+），消息会写入所有目的地；加上它之后
# docker compose logs -f nginx 就能直接看到运行期错误，不必进服务器翻文件。
# 代价: 容器日志（json-file 驱动）默认不轮转，已在 compose 里配 max-size/max-file 兜底。
error_log             stderr warn;

# master 进程 pid 文件。作用域: main | 默认值: 编译默认（通常 logs/nginx.pid）
# 取 /run/nginx.pid: 与官方镜像和 systemd 单元一致，便于 nginx -s reload。
pid                   /run/nginx.pid;

# 优雅停机的时限。作用域: main | 默认值: 无（不设时限，等所有连接自然结束）
# 取 10s: 官方镜像的 STOPSIGNAL 是 SIGQUIT（优雅停机），不设时限时一条视频流或 SSE
# 长连接能让 nginx 久久不退，最终被容器运行时 SIGKILL 强杀，导致访问日志缓冲区未刷盘、
# 临时文件残留；10 秒后自行收尾可保证日志落盘与资源清理。
# 注意: docker-compose.yml 已把 stop_grace_period 设为 20s，比这里的 10s 多留 10s 余量，
# nginx 会先自己收尾完毕，不会被 SIGKILL；反过来千万不要把 compose 的值降到 10s 以下，
# 否则收尾没做完就被强杀，访问日志缓冲区与临时文件同样会丢。
worker_shutdown_timeout 10s;

# ------------------------------------------------------------------------------
# 二、events 块（连接处理模型）
# ------------------------------------------------------------------------------
events {
    # 单工作进程最大并发连接数。作用域: events | 默认值: 512
    # 取 10240: 默认值面向静态小站，网关型负载远高于此；真实上限由
    # worker_rlimit_nofile 与内存共同决定（每连接约占数 KB 内核缓冲）。
    worker_connections   10240;

    # 是否一次取空 accept 队列。作用域: events | 默认值: off
    # 取 on: 高并发下减少 epoll 唤醒次数，低峰期多出的开销可忽略。
    multi_accept         on;

    # 事件驱动模型。作用域: events | 默认值: auto
    # 保持默认 auto: Linux 上 auto 已等价于 epoll，显式写死反而会使配置无法
    # 在非 Linux 平台加载，收益为零，故仅以注释记录。
    # use                epoll;
}

# ------------------------------------------------------------------------------
# 三、http 块（所有站点共用的公共默认值）
# ------------------------------------------------------------------------------
http {
    # --------------------------------------------------------------------------
    # 3.1 MIME 类型与字符集
    # --------------------------------------------------------------------------

    # 标准 MIME 类型表。作用域: http | 默认值: 编译内置精简表
    # 引用发行版随包提供的完整表，免去自行维护；未收录类型退回 default_type。
    include              /etc/nginx/mime.types;

    # 未识别类型时的响应类型。作用域: http | 默认值: text/plain
    # 取 octet-stream: 要求浏览器下载而非内联渲染，避免未知类型被当作 HTML 执行。
    # 适用范围要清楚: nginx 源码里真正会用它兜底的只有 static/flv/mp4/gzip_static 这类
    # 「由 nginx 自己送出响应」的模块，代理模块不调用。也就是说本值只影响本地静态内容
    # （例如 3.15 那套 /error/ 主题错误页、无扩展名文件）；代理响应的 Content-Type 完全
    # 由上游决定，上游没发这个头时 nginx 不会替它补——它不承担「代理站点兜底」的角色。
    default_type         application/octet-stream;

    # 响应字符集标注。作用域: http | 默认值: off
    # 取 utf-8: 上游未声明 charset 时补上参数；未配置 source_charset 时只做标注、
    # 不做转码，因此对上游内容零影响。
    charset              utf-8;

    # --------------------------------------------------------------------------
    # 3.2 日志（全站唯一入口）
    # --------------------------------------------------------------------------
    # 访问日志的唯一出口；错误日志在 main 段声明（一条即覆盖全配置，见该处注释）。
    # 设计取舍: 全站访问日志收成一条、不按站点分文件，靠 vhost= 与 host= 字段区分站点，
    # 排障时一个文件 grep 到底；将来访问量变大，再按段末的可选写法拆分。
    # 站点侧纪律: 不要在 server 内声明 access_log（子层声明会整体取代本层），也不要写
    # access_log off;，否则该站点会脱离这条集中日志，出现「某个站点没有日志」的怪现象。

    # 访问日志格式。作用域: http | 默认值: combined（nginx 内置，始终可用、无需声明）
    # 字段按排查顺序排列:
    #   - vhost: 实际匹配到的 server_name，判断「落到哪个站点」的可信字段；
    #   - host:  请求头里的 Host（已去端口、已转小写），由客户端提供，仅作参考；
    #            两者不一致时，通常意味着存在伪造 Host 的探测流量；
    #   - client: 访客真实 IP（$remote_addr）。本链路下 nginx 直接终结访客连接，
    #            它就是权威值，不需要任何请求头来还原（详见 3.10）；
    #   - xff:    访客自报的 X-Forwarded-For，纯客户端输入、不可采信；保留它是为了
    #            观察伪造流量，判断真实地址永远看 client=；
    #   - uct / urht / urt: 上游建连、首字节、完整响应的耗时，对应 frp 隧道与本地站点；
    #   - rt: 从读入首字节到响应写完的总耗时，与 urt 相减即可判断瓶颈在本地还是上游；
    #   - ustat: 上游状态码，用于区分 502 是隧道断开还是站点自身报错；
    #   - cache: 缓存状态（HIT/MISS/EXPIRED/STALE/BYPASS…）。未启用缓存的站点显示 -；
    #            3.17 段开启缓存后可用它算命中率: grep -o 'cache=[A-Z]*' | sort | uniq -c
    #   - lreq: 限流结果（PASSED/DELAYED/REJECTED/DELAYED_DRY_RUN/REJECTED_DRY_RUN）。
    #            未启用限流的站点显示 -；用 3.9 段的 dry-run 观察时靠它数"本会被拦多少"；
    #   - lconn: 限连结果，取值语义同 lreq（PASSED/DELAYED/REJECTED/DELAYED_DRY_RUN/
    #            REJECTED_DRY_RUN）。未启用限连的站点显示 -；与 3.9 段的 limit_conn_dry_run
    #            配合使用，可数出"本会被限连拦掉多少连接"；
    #   - req:  请求长度（请求行 + 请求头 + 请求体的字节数），用于识别异常上传与探测流量；
    #   - req_id: 核心模块生成，可与上游日志、错误日志串成同一次请求。
    log_format main       'time=$time_iso8601 vhost=$server_name host=$host '
                          'client=$remote_addr "$request" status=$status '
                          'sent=$bytes_sent req=$request_length rt=$request_time '
                          'upstream=$upstream_addr ustat=$upstream_status '
                          'cache=$upstream_cache_status lreq=$limit_req_status '
                          'lconn=$limit_conn_status '
                          'uct=$upstream_connect_time urht=$upstream_header_time '
                          'urt=$upstream_response_time '
                          'referer="$http_referer" ua="$http_user_agent" '
                          'xff="$http_x_forwarded_for" '
                          'req_id=$request_id '
                          'conn=$connection/$connection_requests';

    # 访问日志落盘（全站唯一一条）。作用域: http | 默认值: logs/access.log combined
    # buffer=32k: 批量写盘，降低高并发下的小写入压力；
    # flush=5s: 低峰期最多延迟 5 秒可见（无 flush 时连接不断开就不刷盘）。
    # 路径不含变量，因此缓冲可用、也不需要 open_log_file_cache（见 3.14）。
    access_log           /var/log/nginx/access.log main buffer=32k flush=5s;

    # 落盘归属（重要）: /var/log/nginx 是 compose 挂载的宿主机目录 ./logs，所以这条日志是
    # 宿主机磁盘上的真实文件；docker-compose.yml 的 logging.max-size/max-file 只轮转容器的
    # stdout/stderr（即 main 段那条 error_log stderr），管不到本文件。
    # 因此宿主机上必须自行配置 logrotate（切割后执行 nginx -s reopen 重新打开文件），否则它
    # 会无限增长；且该文件由容器内 root 创建，非 root 的 logrotate 删不动，需要 sudo 或先
    # 调整 ./logs 的属主。

    # 可选扩展（默认不启用，按需打开）:
    #   1) 只记录 4xx/5xx 以压缩日志体积:
    #      map $status $loggable { ~^[23] 0; default 1; }
    #      然后在上面 access_log 行尾追加 if=$loggable
    #   2) 需要按站点分文件时，在对应 server 内覆盖本层（静态路径，仍可用缓冲）:
    #      access_log /var/log/nginx/<site>.access.log main buffer=32k flush=5s;
    #   3) 单条集中日志的切割与保留交给外部 logrotate，切割后执行 nginx -s reopen
    #      重新打开文件（详见 3.14）。

    # --------------------------------------------------------------------------
    # 3.3 静态文件与 TCP 行为
    # --------------------------------------------------------------------------

    # 零拷贝发送本地文件。作用域: http/server/location | 默认值: off
    # 取 on: 错误页、ACME 校验文件等本地静态内容受益；经代理的响应体不经过
    # sendfile，因此该项不影响转发性能。
    sendfile             on;

    # 收齐数据再发包（TCP_CORK）。作用域: http/server/location | 默认值: off
    # 取 on: 与 sendfile 配合减少小包；nginx 在需要立即发送时会自行关闭该行为，
    # 对 keepalive 连接无副作用。
    tcp_nopush           on;

    # 关闭 Nagle 算法。作用域: http/server/location | 默认值: on
    # 取 on: 代理链路存在大量「响应头小包 + 数据包」，等待合并会引入额外延迟，
    # 延迟敏感优先于带宽节省（与 tcp_nopush 的组合是官方推荐搭配）。
    tcp_nodelay          on;

    # 单次 sendfile 调用的数据上限。作用域: http/server/location | 默认值: 2m
    # 取 1m: 防止一个高速连接长时间霸占工作进程，保证其他连接能被调度。
    sendfile_max_chunk   1m;

    # --------------------------------------------------------------------------
    # 3.4 连接保持与超时
    # --------------------------------------------------------------------------

    # 客户端连接空闲超时。作用域: http/server/location | 默认值: 75s
    # 取 65s: 比默认略短——空闲连接早点回收，少占一个 worker 连接槽与一点内核内存；
    # 本拓扑 nginx 就是公网唯一入口，前面没有别的代理，不需要去迁就谁的超时。
    # 将来若在 nginx 前面再加一层 LB/CDN，才需要把本值调到大于那一层的空闲超时，目的是
    # 「让对端先断」，避免客户端复用一条已被自己关闭的连接（那种情况表现为偶发的请求失败
    # 与重试，而不是 499——499 记录的是「客户端在响应发出前就关了连接」）。
    keepalive_timeout    65s;

    # 单连接允许处理的最大请求数。作用域: http/server/location | 默认值: 1000
    # 取 1000: 与默认一致，显式写出便于后续按站点调整；设得过大易造成进程负载不均。
    keepalive_requests   1000;

    # 接收请求头超时。作用域: http/server/location | 默认值: 60s
    # 取 30s: 公网入口应尽早放弃慢速攻击连接（Slowloris 一类）。
    client_header_timeout 30s;

    # 接收请求体超时。作用域: http/server/location | 默认值: 60s
    # 取 30s: 大文件上传是持续有数据到达、不会触发该超时，只有客户端中途卡死才计时。
    client_body_timeout  30s;

    # 发送响应超时。作用域: http/server/location | 默认值: 60s
    # 取 30s: 仅统计两次写操作之间的间隔；客户端长时间不收数据即断开并回收连接。
    send_timeout         30s;

    # 关闭超时连接时直接发 RST。作用域: http/server/location | 默认值: off
    # 取 on: 省去 TIME_WAIT 状态及其内存占用，适合连接量大、瞬时客户端多的公网入口。
    reset_timedout_connection on;

    # --------------------------------------------------------------------------
    # 3.5 请求缓冲与上传上限
    # --------------------------------------------------------------------------

    # 请求体大小上限。作用域: http/server/location | 默认值: 1m
    # 取 64m: 全局保守值。网盘类站点上传远超此值，应在自己的 server 内覆盖为
    # client_max_body_size 0;（不限制）或明确上限，避免全局放开被滥用。
    client_max_body_size 64m;

    # 请求体内存缓冲。作用域: http/server/location | 默认值: 8k|16k
    # 取 128k: 缓冲住常见表单与 POST 主体，减少写临时文件的磁盘 IO。
    client_body_buffer_size 128k;

    # 请求头初始缓冲。作用域: http/server/location | 默认值: 1k
    # 取 4k: 自建站点的 Cookie 与令牌普遍较大，避免一上来就动用大缓冲。
    client_header_buffer_size 4k;

    # 超大请求头缓冲（块数 单块大小）。作用域: http/server/location | 默认值: 4 8k
    # 取 4 16k: 兼容携带 16k 级头部的客户端，超出上限仍会正常返回 400。
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # 3.6 哈希表尺寸
    # --------------------------------------------------------------------------

    # MIME 类型哈希表容量上限。作用域: http | 默认值: 1024
    # 取 2048: 单纯留余量（mime.types 约百条，默认值其实也够）。语义是「封顶」:
    # 写死之后 nginx 不再自动扩容，真超出时启动会报 could not build the types_hash，
    # 按提示放大即可。
    types_hash_max_size  2048;

    # server_name 哈希桶大小。作用域: http | 默认值: 32|64|128（随 CPU 缓存行）
    # 取 64: 本仓库使用 example.example.example 这类长域名，名称过长会直接导致
    # could not build the server_names_hash 启动失败，因此显式留出余量。
    server_names_hash_bucket_size 64;

    # server_name 哈希表最大尺寸。作用域: http | 默认值: 512
    # 取 512: 站点数量少，维持默认容量即可，显式写出便于后续扩容时定位。
    server_names_hash_max_size 512;

    # 变量哈希表最大尺寸。作用域: http | 默认值: 1024
    # 取 2048: 本文件使用了 map 与多个自定义日志变量，放大可避免哈希冲突退化。
    variables_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # 3.7 信息隐藏与安全响应头
    # --------------------------------------------------------------------------

    # 是否在响应头与错误页中暴露版本号。作用域: http/server/location | 默认值: on
    # 取 off: 版本号属信息泄露，攻击者可据此匹配已知漏洞。
    server_tokens        off;

    # 禁止浏览器猜测 MIME 类型。作用域: http/server/location | 默认值: 无
    # always 参数使 4xx/5xx 错误响应同样携带该头（默认只在 2xx/3xx/204/304 生效）。
    # 注意 add_header 的继承规则: 子级只要出现任意一条 add_header，
    # 父级全部 add_header 都会失效，站点自行添加安全头时必须把这三条一并重写。
    add_header           X-Content-Type-Options nosniff always;

    # 控制 Referer 的外泄粒度。作用域: http/server/location | 默认值: 无
    # 取 no-referrer-when-downgrade: 同为 HTTPS 时保留来源、降级到 HTTP 时不发送。
    add_header           Referrer-Policy no-referrer-when-downgrade always;

    # 是否允许别人把你的页面嵌进 iframe。作用域: http/server/location | 默认值: 无
    # 取 DENY: 谁都不许嵌，彻底挡住点击劫持（伪造透明页面骗取访客点击）。
    # 若某个站点需要被其他页面嵌入（个别仪表盘会这样），再在该站点放宽为 SAMEORIGIN。
    add_header           X-Frame-Options DENY always;

    # 另一个坑（站点层）: add_header 是「追加」，不会替换上游响应里已有的同名头。上游应用
    # 自己发了 X-Frame-Options 或 CSP 时，浏览器会看到两条同名头、行为不确定；这类站点要
    # 先在站点层用 proxy_hide_header X-Frame-Options; 删掉上游那条，只保留本文件这条。

    # --------------------------------------------------------------------------
    # 3.8 gzip 压缩
    # --------------------------------------------------------------------------

    # 压缩总开关。作用域: http/server/location | 默认值: off
    # 取 on: 本站点群以文本资源为主（博客的 HTML/CSS/JS、导航站的静态前端），
    # 压缩收益明显；视频站应在自己的 server 内 gzip off; 关闭，避免白烧 CPU。
    gzip                 on;

    # 压缩强度。作用域: http/server/location | 默认值: 1
    # 取 5: 压缩率与 CPU 的折中；级别 6 以上收益递减，而 CPU 上升明显。
    gzip_comp_level      5;

    # 小于该长度不压缩。作用域: http/server/location | 默认值: 20
    # 取 1k: 小响应压缩后可能反而变大，1k 以下直接放行。
    gzip_min_length      1k;

    # 压缩所用缓冲（块数 单块大小）。作用域: http/server/location | 默认值: 32 4k|16 8k
    # 取 16 8k: 与常见内存页大小对齐，减少内存碎片。
    gzip_buffers         16 8k;

    # 允许压缩的最低 HTTP 版本。作用域: http/server/location | 默认值: 1.1
    # 取 1.1: 与上游代理 keepalive 的版本语义保持一致，避免多出 1.0 特例分支。
    gzip_http_version    1.1;

    # 是否为来自代理的响应压缩。作用域: http/server/location | 默认值: off
    # 取 any: 本配置全部站点都是反向代理，保持默认会导致压缩完全不生效。
    gzip_proxied         any;

    # 响应中是否附加 Vary: Accept-Encoding。作用域: http/server/location | 默认值: off
    # 取 on: 让缓存区分压缩与未压缩版本，否则可能把压缩体发给不支持压缩的客户端。
    gzip_vary            on;

    # 参与压缩的 MIME 类型。作用域: http/server/location | 默认值: 仅 text/html（强制压缩）
    # 白名单原则:
    #   - 只压文本类与未压缩的字体（ttf/otf）；
    #   - 不包含 application/octet-stream: 网盘下载大文件，压缩纯属浪费 CPU 与内存；
    #   - 不包含 font/woff 与 font/woff2: 格式本身已压缩；
    #   - 不包含 image/*（矢量图 svg 除外）与 video/*: 视频流量必须绕开 gzip。
    gzip_types           text/plain text/css text/xml text/javascript
                         application/javascript application/json
                         application/xml application/xhtml+xml
                         application/rss+xml application/atom+xml
                         application/manifest+json application/vnd.api+json
                         application/ld+json text/markdown
                         application/wasm
                         image/svg+xml font/ttf font/otf
                         application/x-font-ttf application/x-font-opentype;

    # --------------------------------------------------------------------------
    # 3.9 限流与限连（共享内存 zone 定义）
    # --------------------------------------------------------------------------

    # 请求速率限制 zone（漏桶算法）。作用域: 仅 http | 默认值: 无
    # key 取 $binary_remote_addr（4/16 字节定长）而非 $remote_addr（字符串），更省内存；
    # 容量换算（官方口径）: 每个状态 64 位平台占 128 字节、32 位平台占 64 字节，1m 约存
    # 8 千个（64 位）；故 zone=req_per_ip:10m 约可容纳 8 万个独立客户端状态（32 位约 16 万个）。
    # 本文件只定义 zone、不启用限制: limit_req 一旦启用，视频站的进度心跳与
    # 网盘的分片上传都会被误伤，因此交由各站点按需启用，例如:
    #   location / { limit_req zone=req_per_ip burst=50 nodelay; }
    limit_req_zone       $binary_remote_addr zone=req_per_ip:10m rate=20r/s;

    # 并发连接限制 zone。作用域: 仅 http | 默认值: 无
    # 用于压制单 IP 的大量并发（爬虫、离线下载），同样是只定义不启用:
    #   location / { limit_conn conn_per_ip 20; }
    limit_conn_zone      $binary_remote_addr zone=conn_per_ip:10m;

    # 触发限流时返回的状态码。作用域: http/server/location | 默认值: 503
    # 取 429: 「请求过多」比「服务不可用」语义更准确，也便于客户端区分重试策略。
    limit_req_status     429;

    # 触发限连时返回的状态码。作用域: http/server/location | 默认值: 503
    # 取 429: 与限流保持一致的对外语义。
    limit_conn_status    429;

    # 调参流程（将来在站点里真正启用限流时按这个顺序做，避免误杀正常访客）:
    #   第 1 步: 站点里只写 limit_req zone=... 再加 limit_req_dry_run on;（限连同理用
    #     limit_conn_dry_run on;）—— 只统计不拦截，本来会被限流的请求照常放行；
    #   第 2 步: 观察一段时间，用日志字段 lreq= 数规模:
    #     grep -c 'lreq=REJECTED_DRY_RUN' /var/log/nginx/access.log
    #     手机流量与公司网络常共享出口 IP，这一步能提前暴露"会误杀多少人"；
    #   第 3 步: 确认阈值合适后，去掉那一行 dry-run 开关，改为真正拦截。

    # --------------------------------------------------------------------------
    # 3.10 真实客户端 IP（本拓扑下默认不需要启用）
    # --------------------------------------------------------------------------

    # 本仓库的链路是「访客 -> nginx -> frp 端口 -> 本地站点」: nginx 直接终结访客的
    # TCP 连接，$remote_addr 天然就是访客真实 IP，不需要读取任何请求头来还原。
    # 所以下面这段保持注释状态；只有将来在 nginx 前面再加一层代理（CDN、WAF 等）
    # 时才需要启用，届时必须注意两点:
    #   1) set_real_ip_from 只能填那层代理的地址（CIDR），绝不能写 0.0.0.0/0，
    #      否则任何客户端都能伪造头里的 IP，绕过限流并污染访问日志；
    #   2) real_ip_header 填那层代理实际发送的字段（多数 CDN 用 X-Forwarded-For）。
    # 本组指令由 realip 模块提供，要求编译时带 --with-http_realip_module
    # （官方镜像与主流发行版均已包含）。启用后 $remote_addr 与 $binary_remote_addr
    # 会被改写，而 realip 的处理阶段早于限流取值阶段，因此限流 zone 的 key 也能拿到
    # 真实 IP。示例里的 192.0.2.0/24 属文档专用测试网段，务必换成前置代理的真实地址。
    # set_real_ip_from    192.0.2.0/24;
    # real_ip_header      X-Forwarded-For;
    # real_ip_recursive   on;

    # --------------------------------------------------------------------------
    # 3.11 协议升级判定（WebSocket）
    # --------------------------------------------------------------------------

    # 依据 Upgrade 头派生 Connection 头的取值。作用域: 仅 http | 默认值: 无
    # 两个分支的取值是整段配置的关键:
    #   - 普通请求取空字符串: 绝不能写成 close，否则所有正常请求都会带着
    #     Connection: close 访问上游，上游 keepalive 连接池直接失效；
    #     此写法与官方 upstream keepalive 文档中的 proxy_set_header Connection "";
    #     等价，是上游连接复用能够生效的前提。
    #   - WebSocket 请求取 upgrade: 完成协议升级。
    # map 变量按需取值，未被使用的分支不产生任何请求期开销。
    # 纪律: $connection_upgrade 已在此定义，站点文件里不要再写同名 map（同名变量会由
    # 后定义者静默接管、影响所有 server，个别情况直接报 duplicate variable）；
    # 需要别的映射关系时换个变量名，或直接复用本变量。
    map $http_upgrade $connection_upgrade {
        default          upgrade;
        ''               '';
    }

    # 站点层必读: 这个 map 只解决「能升级」，能不能一直活着由超时决定——3.12 的
    # proxy_read_timeout 60s 会在空闲 60 秒后切断已升级的 WebSocket 连接
    # （网盘的实时通知、图库的实时刷新、视频站的播放控制都走 WS）。凡是用到本变量的
    # location，都必须在站点层把它放大，例如 proxy_read_timeout 3600s;（写方向同理）。

    # --------------------------------------------------------------------------
    # 3.12 反向代理公共默认值（站点 server/location 自动继承）
    # --------------------------------------------------------------------------

    # 与上游通信使用的 HTTP 版本。作用域: http/server/location | 默认值: 1.0
    # 取 1.1: 上游 keepalive 复用的前提条件（站点需在自己的 upstream 内声明 keepalive N）。
    proxy_http_version   1.1;

    # 透传给上游的 Host。作用域: http/server/location | 默认值: $proxy_host
    # 取 $host: 上游站点依赖公网域名生成绝对链接与 Cookie 域；使用默认值会把
    # 127.0.0.1:<frp 端口> 传过去，导致响应中的跳转指向内网地址。
    proxy_set_header     Host              $host;

    # 客户端真实 IP（单值形式）。作用域: http/server/location | 默认值: 无
    # 供上游按 X-Real-IP 记录日志或做访问控制。
    proxy_set_header     X-Real-IP         $remote_addr;

    # 客户端真实 IP（链式形式）。作用域: http/server/location | 默认值: 无
    # 这里刻意用「覆盖」而不是追加: nginx 已是公网唯一入口，$remote_addr 就是真实
    # 访客地址；若改用 $proxy_add_x_forwarded_for 追加，访客自己编造的假 IP 会被
    # 一并传给本地站点，上游若读第一个地址就会采信假值。覆盖后上游拿到的始终是
    # 唯一且真实的访客地址。
    proxy_set_header     X-Forwarded-For   $remote_addr;

    # 原始请求协议。作用域: http/server/location | 默认值: 无
    # 上游据此生成 https 链接、下发 Secure Cookie，缺失会导致混合内容告警。
    proxy_set_header     X-Forwarded-Proto $scheme;

    # 原始域名。作用域: http/server/location | 默认值: 无
    # 部分自建应用（生成分享链接、跳转地址、Cookie 域）会优先读它，不传时只能退回 Host。
    proxy_set_header     X-Forwarded-Host  $host;

    # 原始端口。作用域: http/server/location | 默认值: 无
    # 值是访客实际访问的 80/443，避免应用把链接拼成上游的内网端口。
    proxy_set_header     X-Forwarded-Port  $server_port;

    # 协议升级与连接头。作用域: http/server/location | 默认值: Connection close
    # 这两条共同支撑两件事: WebSocket 升级、上游 keepalive 复用（取值见 3.11 的 map）。
    proxy_set_header     Upgrade           $http_upgrade;
    proxy_set_header     Connection        $connection_upgrade;

    # 继承规则提醒: 上述 proxy_set_header 属于「子级一旦出现就整体取代父级」的指令。
    # 站点在自己的 server/location 内每补写一条 proxy_set_header，都必须把需要的
    # 父级条目一并重写，否则父级这批头会全部丢失。

    # 与上游建立连接的超时。作用域: http/server/location | 默认值: 60s
    # 取 5s: 上游是本机回环上的 frp 端口，握手属微秒级；5 秒仍未连上说明隧道已断，
    # 应快速失败让客户端立刻看到 502，而不是空等 60 秒。
    proxy_connect_timeout 5s;

    # 向上游发送请求的超时。作用域: http/server/location | 默认值: 60s
    # 保持 60s: 网盘大文件上传是持续写入，不会触发该超时，无需再放大。
    proxy_send_timeout   60s;

    # 读取上游响应的超时。作用域: http/server/location | 默认值: 60s
    # 保持 60s: 仅统计两次读操作之间的间隔；视频站的长时间静默响应
    # 应在站点层覆盖为 300s 以上（例如等待转码或首帧）。
    proxy_read_timeout   60s;

    # --------------------------------------------------------------------------
    # 3.13 请求与响应缓冲
    # --------------------------------------------------------------------------

    # 请求体是否先缓冲。作用域: http/server/location | 默认值: on
    # 取 off: 默认行为是「先把整个请求体收完并写入本机临时文件，再去连上游」，
    # 往网盘传几 GB 时等于凭空占用同等的临时磁盘、多一轮读写，且上游要等全收完
    # 才开始收到数据；关掉后边收边转发，上游立即开始处理，磁盘与内存都更省。
    # 代价: 上传中途隧道断开无法重发（本配置本就没有可重试的备用上游）；
    # 转发改用 chunked 编码，个别老框架兼容不佳时在该站点写回 on 即可。
    proxy_request_buffering off;

    # 上游响应缓冲总开关。作用域: http/server/location | 默认值: on
    # 取 on: 尽量先把上游数据读进缓冲再回写客户端，避免慢客户端长时间占着上游
    # 连接，保护 frp 隧道这一稀缺资源；视频站应在站点层覆盖为 off 走流式直通。
    proxy_buffering      on;

    # 响应缓冲块数量与单块大小。作用域: http/server/location | 默认值: 8 4k|8k
    # 取 8 16k: 单连接最多使用 128k，兼顾吞吐与内存；缓冲按需分配，并非预占。
    proxy_buffers        8 16k;

    # 响应头专用缓冲。作用域: http/server/location | 默认值: 4k|8k
    # 取 16k: 上游 Set-Cookie 较多或令牌较长时，默认值会触发
    # upstream sent too big header 并返回 502，这是自建站点最常见的 502 成因。
    proxy_buffer_size    16k;

    # 忙时缓冲上限（正在向客户端发送的部分）。作用域: http/server/location | 默认值: 8k|16k
    # 取 32k: 官方要求其值不小于 proxy_buffers 的单块大小，且不超过总缓冲的一半。
    proxy_busy_buffers_size 32k;

    # 写临时文件的块大小。作用域: http/server/location | 默认值: 8k|16k
    # 取 16k: 与响应缓冲块对齐，减少磁盘写次数。
    proxy_temp_file_write_size 16k;

    # 单条连接可用的临时文件上限。作用域: http/server/location | 默认值: 1024m
    # 取 128m: 响应超出缓冲、且客户端收得很慢时（网盘拖大文件、访客用手机流量），
    # 中间数据会落到容器可写层的临时文件；默认 1G/连接意味着几个并发下载就能把
    # 服务器磁盘写满，随后全站报 no space left on device。收紧到 128m 后，
    # 超限即暂停从上游读取（形成背压），上游是本机隧道，多等一会儿的代价很小。
    proxy_max_temp_file_size 128m;

    # 可选: 单条连接的取数速率上限（字节每秒，例如 1m）。作用域: http/server/location
    # 默认不限速。想保护家宽上行、避免一个人拖库把隧道占满，可在网盘站点的
    # location 里写 proxy_limit_rate 1m;（取值参考家宽上行除以期望并发人数）。
    # 注意: 视频站别限，4K 直连播放本身就要几十 Mbps，会被拖成幻灯片。

    # 上游响应头哈希表上限。作用域: http/server/location | 默认值: 512
    # 取 1024: 本配置注入的自定义头较多，放大以容纳「透传头 + 自定义头」总量，
    # 避免启动阶段构建哈希表失败。
    proxy_headers_hash_max_size 1024;

    # 上游响应头哈希桶大小。作用域: http/server/location | 默认值: 64
    # 取 64: 保持默认即可，显式写出便于与上一行成对调整。
    proxy_headers_hash_bucket_size 64;

    # 隐藏上游响应头。作用域: http/server/location | 默认值: 仅隐藏 Date/Server/X-Pad/X-Accel-*
    # 追加隐藏 X-Powered-By: 该头会暴露上游框架与版本，属不必要的信息泄露。
    proxy_hide_header    X-Powered-By;

    # --------------------------------------------------------------------------
    # 3.14 有意不写入本文件的指令
    # --------------------------------------------------------------------------

    # 以下几项保持 nginx 默认值或交由站点层处理，理由如下:
    #   proxy_next_upstream: 保持默认 error timeout。每个 upstream 只对应一台
    #     frp 后端，重试没有备用机器可切换；且对 POST 与上传类非幂等请求重试
    #     可能造成重复提交。
    #   proxy_redirect: 保持默认 default（按 location 与 proxy_pass 重写 Location）。
    #     改成 off 会把上游写出的内网地址原样抛给客户端；若上游确实返回了
    #     127.0.0.1:<端口> 形式的绝对地址，再在站点层用 proxy_redirect 精确改写。
    #   resolver: 上游都是回环地址的固定端口，没有域名需要在运行期解析；
    #     只有当 proxy_pass 的地址中带变量时才必须配置 resolver。
    #   logrotate: 访问日志是单条集中文件（见 3.2），切割与保留由外部 logrotate 负责，
    #     切割后执行 nginx -s reopen 让 nginx 重新打开该文件。
    #   open_log_file_cache: 日志路径不含变量，不需要描述符缓存。
    #   stub_status 与 allow/deny: 属于站点级 location（例如 /nginx_status），
    #     由 conf.d 声明并配合访问控制，不放进通用底座。
    #   underscores_in_headers: 默认 off，即丢弃名字带下划线的请求头（例如 app_token）。
    #     主流应用用连字符命名，不受影响；只有站点确实依赖下划线头时才在站点层开启。
    #   daemon off;: 官方镜像的启动命令已是 nginx -g "daemon off;"，容器内必须前台运行；
    #     若在本文件再写一条，nginx 会因「daemon 指令重复」直接启动失败。
    #   proxy_cookie_domain / proxy_cookie_path: 自建应用下发 Cookie 时若写成
    #     Domain=localhost、内网 IP 或 Path=/app 之类，浏览器会认为它不属于你的域名，
    #     表现为「登录成功但一刷新就退出」；届时用这两条把域与路径掰正。
    #   valid_referers / secure_link: 防盗链。前者只允许从自己域名点进来的请求，
    #     后者要求链接带签名与有效期（需应用配合生成），视频与网盘站点按需启用。
    #   运行期错误也想进容器日志: 已由 main 段的第二条 error_log（stderr）提供，
    #     配套的 compose 日志轮转上限也已配置。
    #
    # 临时目录（client_body_temp_path / proxy_temp_path）保持编译默认值，不显式声明:
    # 路径由构建参数决定，写死会在换成别的 nginx 构建后启动失败。上手前先对照:
    #   官方镜像（nginx:stable / nginx:alpine，Debian 与 Alpine 变体取值相同）
    #     -> /var/cache/nginx/client_temp、/var/cache/nginx/proxy_temp
    #   Debian/Ubuntu 发行版自带包（apt install nginx）
    #     -> /var/lib/nginx/body、/var/lib/nginx/proxy
    # 原因: 官方镜像现在是安装 nginx.org 的包，其打包参数统一用 /var/cache/nginx/*；
    # 只有发行版自行打包的才用 /var/lib/nginx/*。
    # 附带结论: 将来若要把临时文件挂到宿主机，官方镜像的挂载目标就是 /var/cache/nginx。
    #
    # 明确不要加的指令（网上常见，但在这里是坑）:
    #   brotli: 官方镜像没有编译该模块，写了会直接启动失败（unknown directive）；
    #     想用只能自行构建镜像。
    #   gzip_static: 只对本地磁盘上已存在的 .gz 预压缩文件生效；本配置是纯代理，
    #     本地没有静态资源，写了是永不生效的死配置。
    #   gzip_disable "msie6": 只对 IE6 的解压缺陷有意义，今天的访客里没有这种浏览器，
    #     留着就是永不生效的死配置（与 gzip_static 同一性质），故不在本文件声明。
    #   pcre_jit: 官方镜像支持，但本配置几乎不用正则 location，收益趋近于零；
    #     换到不支持 JIT 的构建上反而会直接启动失败，不划算。
    #   aio、directio、open_file_cache、output_buffers: 都是服务本地大文件的优化，
    #     纯代理场景没有收益。
    #   ssl_stapling: 需要配合 resolver 与受信证书链，自建证书场景收益与风险不成正比。
    #   proxy_socket_keepalive: 靠内核发现死连接，而 Linux 默认要 2 小时才发起探测，
    #     比 proxy_read_timeout 60s 慢得多，轮不到它生效；上游是本机回环端口，
    #     对端进程消失时立刻能收到 RST/FIN，故不写。

    # --------------------------------------------------------------------------
    # 3.15 统一错误页（全局映射表）

    # 现成的错误页来自 conf.d/error 子模块（error-pages: 11 个主题 × 20 个状态码），
    # 它随 ./conf.d 一起挂进容器，真实路径是 /etc/nginx/conf.d/error/<主题>/<代码>.html。
    # 全站统一用 hacker-terminal 主题: 这里只放「映射表」（http 层声明一次，所有 server 继承），
    # 真正把文件送出去的 location 由 conf.d/snippets/error-pages.conf 提供，各 server include。
    # 两处必须成对存在: 少了那个 location，内部跳转会落到不存在的文件上，访客看到的还是 404。

    # 是否拦截上游返回的错误。作用域: http/server/location | 默认值: off
    # 取 on: 不开的话，上游（本地站点经 frp 隧道回来）的 4xx/5xx 会原样透传给访客，
    # 主题错误页只对 nginx 自己产生的错误生效；开了之后两边统一。
    # 映射范围由下面的 error_page 决定: 没列出的码（401、407，以及主题里没有的码）仍原样透传。
    proxy_intercept_errors on;

    # 错误页映射表。作用域: http/server/location | 默认值: 无
    # 18 个码全部映射到同主题的同名页面（目标里的 $status 就是出错时的状态码）:
    #   400 403 404 405 408 409 410 411 412 413 416 418 429 500 502 503 504 505
    # 目标 URI 可以用变量（官方文档: A uri value can contain variables.），所以 18 个码
    # 只需要一行；代价是目标带变量时 nginx 不再预检文件是否存在，因此这 18 个文件名必须与
    # 状态码一一对应（hacker-terminal 目录里正好是那 20 个文件减去 401、407）。
    # 刻意不映射的两个: 401（通常带 WWW-Authenticate 挑战头，换页可能破坏浏览器密码弹窗）、
    #   407（代理认证专用，本拓扑用不到）；444 与 495/496/497 没有 HTTP 响应可换页。
    # 继承规则提醒: 站点里一旦自己写了 error_page，本表在该站点整体失效（是取代、不是叠加）。
    error_page 400 403 404 405 408 409 410 411 412 413 416 418 429
               500 502 503 504 505 /error/hacker-terminal/$status.html;

    # --------------------------------------------------------------------------
    # 3.16 全局 TLS 参数
    # --------------------------------------------------------------------------
    # 本段只放「加密标准」，不含任何证书路径；证书、http2 on;、HSTS 响应头都属站点层。
    # 站点 server 里一旦出现 ssl_certificate，就会继承这里的全部取值；当前还没有站点
    # 启用 HTTPS，所以这些参数处于待用状态，不影响任何现有行为。

    # 允许的 TLS 协议版本。作用域: http/server | 默认值: TLSv1.2 TLSv1.3（1.23.4 起）
    # 取 TLSv1.2 TLSv1.3: 显式关掉 SSLv3 与 TLSv1.0/1.1 这些已淘汰版本，同时便于审计。
    ssl_protocols        TLSv1.2 TLSv1.3;

    # 加密套件白名单。作用域: http/server | 默认值: HIGH:!aNULL:!MD5（含 CBC 类老算法）
    # 这里用 OpenSSL 的关键字表达式而不是逐条罗列：ECDHE+AESGCM 与 ECDHE+CHACHA20 都是
    # 前向保密加 AEAD 认证加密的组合，同时排除 aNULL 与 MD5；写成表达式行短、易读。
    # 该指令只作用于 TLS 1.2 及以下，TLS 1.3 的套件由 OpenSSL 内置决定，不受它控制。
    ssl_ciphers          ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5;

    # 套件由客户端还是服务端优先挑。作用域: http/server | 默认值: off
    # 取 off: 让客户端先挑，对手机与老旧设备兼容性更好；TLS 1.3 下该指令无影响。
    ssl_prefer_server_ciphers off;

    # 会话缓存。作用域: http/server | 默认值: none（= 每个连接都重新握手）
    # 取 shared:SSL:10m: 10MB 共享内存约容纳 4 万个会话，刷新与多请求场景显著减少握手。
    ssl_session_cache    shared:SSL:10m;

    # 会话复用有效期。作用域: http/server | 默认值: 5m
    # 取 1h: 与浏览器保留会话票据的时长接近，回访时可省掉完整握手。
    ssl_session_timeout  1h;

    # 会话票据开关。作用域: http/server | 默认值: on
    # 取 off: 票据是把会话状态加密后交给访客保管、服务端无法吊销，关掉更稳妥
    # （未显式配置 ssl_session_ticket_key 时，密钥由 OpenSSL 在内存中生成，不落盘）。
    # 代价: RFC 8446 的 TLS 1.3 没有 session ID 复用、只能靠票据，所以关掉后 TLS 1.3
    # 客户端基本不再复用会话、回访要多做一次完整握手；共享会话缓存此时只服务 TLS 1.2。
    ssl_session_tickets  off;

    # ECDHE 曲线（TLS 加密组）清单。作用域: http/server | 默认值: auto
    # 注意这行是「白名单」而不是「优先级」: 列出来就只留这些组，OpenSSL 3.x 内置列表里的
    # 其它组会被一并剔除，典型的有 X25519MLKEM768（抗量子混合组，新版浏览器已优先协商）、
    # X448 与 secp521r1。
    # 取这三个: X25519 最快，secp256r1/secp384r1 兼容性最好（与 Mozilla 推荐曲线组合一致）。
    # 代价与后路: 白名单把抗量子混合组也剔掉了，新版浏览器会退回普通 X25519——功能与安全性
    # 不受影响，只是少了抗量子这一层。想加回来就写成
    # X25519MLKEM768:X25519:secp256r1:secp384r1；但组名由镜像内 OpenSSL 的版本决定
    # （3.5 起叫 X25519MLKEM768），写错名字 nginx 会以 SSL_CTX_set1_groups_list() failed
    # 直接启动失败，所以改完务必先跑 nginx -t。
    # 不想维护这份名单的话，删掉本行改用默认的 auto 也可以。
    ssl_ecdh_curve       X25519:secp256r1:secp384r1;

    # TLS 记录大小。作用域: http/server | 默认值: 16k
    # 取 16k: 吞吐优先；若小响应为主、首字节延迟更重要，可改为 4k，代价是包数变多。
    ssl_buffer_size      16k;

    # 站点层配套（都是 server 块级指令，本文件写不了，做到 HTTPS 时照抄）:
    #   1) 未知域名兜底: 单独建一个默认 HTTPS 站点，让陌生域名的握手在 TLS 阶段就被拒，
    #      既不暴露证书也不暴露页面；它与 HTTP 侧的 default_server + return 444; 是一对。
    #        server {
    #            listen 443 ssl default_server;
    #            ssl_reject_handshake on;      # 1.19.4+，该 server 不需要也不该配证书
    #        }
    #   2) 证书与 HTTP/2: ssl_certificate、ssl_certificate_key、http2 on; 都写在站点里。
    #   3) HSTS: 只在 HTTPS 站点里加 Strict-Transport-Security，max-age 从小值起步。

    # --------------------------------------------------------------------------
    # 3.17 缓存基础设施（只定义，不启用）
    # --------------------------------------------------------------------------
    # 本段只准备「缓存放哪」与「缓存键」，不开启任何缓存：真正生效需要在站点里写
    # proxy_cache static_cache;（与 3.9 的限流 zone 同一思路，避免误伤网盘与视频）。
    # 收益: 博客、导航站的静态页面命中缓存后由本机磁盘直接返回，不再穿过 frp 隧道。

    # 缓存存储与容量。作用域: 仅 http | 默认值: 无
    # levels=1:2 两级目录，避免单个目录堆积海量文件；
    # keys_zone 是内存索引（官方口径: 1m 约 8 千条键，故 10m 约 8 万条）；
    # max_size=1g 是磁盘上限，超出后淘汰最旧的；inactive=7d 表示七天未被访问即清除；
    # use_temp_path=off 直接写入缓存目录，省掉「先写临时文件再搬移」的一次磁盘 IO。
    # 注意: 缓存目录在容器可写层，容器重建即清空（静态页首次回源即可，无实质损失）。
    proxy_cache_path     /var/cache/nginx/cache levels=1:2 keys_zone=static_cache:10m
                         max_size=1g inactive=7d use_temp_path=off;

    # 缓存键。作用域: http/server/location | 默认值: $scheme$proxy_host$request_uri
    # 取 $scheme$host$request_uri: 用「协议 + 访客请求的域名 + 路径」作键，
    # 四个站点与不同页面不会互相串味；默认值里的 $proxy_host 是上游地址，区分不了站点。
    # 另一点必须知道: 缓存不区分 Accept-Encoding（Vary 不参与缓存键）。上游若自己压了
    # gzip 并回 Content-Encoding: gzip，缓存条目会原样发给不支持 gzip 的访客（页面全花）。
    # 开缓存的站点三选一: ①键里加 $http_accept_encoding；②该站点写
    #   proxy_set_header Accept-Encoding ""; 让上游回明文、压缩统一交给 nginx
    #   （代价: 穿越隧道的字节变多，家宽上行吃紧时优先选 ①）；③只缓存不带
    #   Content-Encoding 的资源。
    proxy_cache_key      $scheme$host$request_uri;

    # 站点启用缓存时的推荐写法（前面几行是"打开并调好缓存"，最后两行是"避免事故"）:
    #   proxy_cache            static_cache;                      # 真正打开缓存
    #   proxy_cache_valid      200 301 302 10m;                   # 让成功响应存活 10 分钟
    #   proxy_cache_lock       on;                                # 未命中时只放一个请求去上游
    #   proxy_cache_background_update on;                         # 过期后先给旧内容，后台回源
    #   proxy_cache_use_stale  error timeout http_500 http_502 http_503 http_504
    #                          updating;
    #     上游不可用（隧道断、家里断网）时直接用过期缓存顶上，访客看到旧页面而不是 502；
    #     updating 与上面的 background_update 配套: 回源更新那几秒也先给旧内容，全程无感。
    #   proxy_cache_bypass     $cookie_session $http_authorization;   # 带登录态的不读缓存
    #   proxy_no_cache         $http_authorization;                   # 带令牌的不写缓存
    # 最后两条必须写，否则会出现「看到别人的已登录页面」一类事故。

    # --------------------------------------------------------------------------
    # 3.18 引入站点级配置
    # --------------------------------------------------------------------------

    # 站点配置入口。作用域: http | 默认值: 无
    # upstream / server / location / 证书路径等业务内容全部位于 conf.d，
    # 本文件保持「通用底座」的定位，二者职责边界即在此行。
    include              /etc/nginx/conf.d/*.conf;
}
