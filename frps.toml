# ==============================================================================
# FRP 服务端主配置 (frps.toml)
# ------------------------------------------------------------------------------
# 送达方: frps —— 部署在具有公网 IP 的服务器上（本仓库用 docker-compose.yml 运行）。
# 拓扑:   客户端 ──> nginx(服务器) ──> 127.0.0.1:<映射端口> ──> frps ──隧道──> frpc ──> 本地服务
#   只有 7000 端口接受 frpc 连接；站点流量由 frpc 以 TCP 代理映射回服务器，
#   再由服务器上的 nginx 终结 TLS 对外服务（域名证书由 nginx 管理，与本文件无关）。
# 客户端配套: frpc 的 serverAddr/serverPort/auth.token/transport.tls 必须与这里一致；
#   与隧道相关的数值（如 udpPacketSize）两端也必须一致。
# 约定: 本文件所有与环境相关的值都是占位符，部署前必须替换；每条指令前的中文注释写明
#   「作用域 / 默认值 / 取值理由」，属交付内容的一部分，不要删减或翻译。
# 官方参考: https://gofrp.org/zh-cn/docs/reference/server-configures/
#           https://github.com/fatedier/frp/blob/dev/conf/frps_full_example.toml
# ==============================================================================

# ------------------------------------------------------------------------------
# 一、监听地址与端口
# ------------------------------------------------------------------------------

# 服务端监听地址，用于接收 frpc 的连接。作用域: 全局 | 默认值: "0.0.0.0"
# 取 0.0.0.0: 多张网卡都能接入；只想允许内网时可换成具体网卡地址。
# 注意: 单个 bindAddr 写 IPv6 不需要方括号，如 bindAddr = "::"。
bindAddr = "0.0.0.0"

# 服务端监听端口。作用域: 全局 | 默认值: 7000
# 取 7000: 与 frpc 的 serverPort 必须一致；改端口要同步改客户端与防火墙。
bindPort = 7000

# 服务端监听 KCP 协议的 UDP 端口。作用域: 全局 | 默认值: 0（禁用）
# 本仓库只用 TCP 传输，故保持禁用；启用需放行该 UDP 端口并把 frpc 的 transport.protocol 改成 kcp。
# kcpBindPort = 7001

# 服务端监听 QUIC 协议的 UDP 端口。作用域: 全局 | 默认值: 0（禁用）
# 本仓库只用 TCP 传输，故保持禁用。QUIC 对丢包严重的家宽上行更友好；将来启用时，
# 除放行 UDP 端口外，可在「网络传输层」段按需补上 transport.quic.* 调参。
# quicBindPort = 7002

# 代理监听地址，即被映射端口绑在哪张网卡上。作用域: 全局 | 默认值: 同 bindAddr
# 取 0.0.0.0: 让映射出去的端口对所有网卡可见 —— 服务器上的 nginx 能在 127.0.0.1 上反代它。
proxyBindAddr = "0.0.0.0"

# ------------------------------------------------------------------------------
# 二、网络传输层 (transport)
# ------------------------------------------------------------------------------

# 单个代理的连接池上限。作用域: 全局 | 默认值: 5
# 取 5: 跟随官方默认。连接池让同一代理的多次请求复用已建好的隧道连接；
# 若压到 1，每次请求都要新建连接，会明显拖慢响应。客户端配置更大也会被强制压到此值。
transport.maxPoolCount = 5

# 是否开启 TCP 流多路复用。作用域: 全局 | 默认值: true
# 取 true（此行仅显式记录，不改变行为）: 多条请求复用一条 TCP 连接。
# 正因如此，应用层心跳（transport.heartbeatTimeout）无需开启 —— 保活由下面的
# tcpMuxKeepaliveInterval 负责，所以本文件不声明 heartbeatTimeout。
# transport.tcpMux = true

# TCP 多路复用连接的保活间隔，单位秒。作用域: 全局 | 默认值: 30
# 取 30: 跟随官方默认。这是本链路真正生效的保活：越小则隧道断开被发现得越快，
# 代价是多一点心跳流量；家宽抖动大时可放宽到 60。
transport.tcpMuxKeepaliveInterval = 30

# 与 frpc 之间底层 TCP 连接的 keepalive 间隔，单位秒，负数表示禁用。作用域: 全局 | 默认值: 7200
# 取 7200: 跟随官方默认（2 小时）。它是内核级 TCP keepalive，发现死连接很慢，
# 隧道保活实际由上面的 tcpMuxKeepaliveInterval 负责，故不必调小。
transport.tcpKeepalive = 7200

# 是否只接受启用了 TLS 的客户端连接。作用域: 全局 | 默认值: false
# 取 true: 公网服务端应拒绝明文隧道。frpc 从 v0.50.0 起默认开启 TLS，故开箱即通；
# 这里无需提供任何证书 —— 未配置 certFile/keyFile 时 frps 会随机生成一张证书加密隧道
# （该证书每次启动都会变，客户端默认也不校验它）。代价: 显式写了
# transport.tls.enable = false 的老客户端会连不上。
# 补充: 一旦下面的 trustedCaFile 填了有效路径，frp 会自动把 force 置为 true。
transport.tls.force = true

# 隧道 TLS 的服务端证书 / 私钥 / 受信 CA。作用域: 全局 | 默认值: 空
# 本仓库不配证书（用 frps 随机生成的那张），故以下三行保持注释。
# 需要「frpc 校验 frps 身份」时的用法:
#   certFile/keyFile: frps 对外出示的证书与私钥
#   trustedCaFile   : 用来校验 frpc 身份的 CA；一旦填写，force 自动变 true
#   frpc 侧相应配置 transport.tls.trustedCaFile（校验 frps）与自身 cert/key（双向校验）
# 注意: 不要复用 nginx 的站点证书 —— 用途与信任链不同，证书文件权限也更敏感。
# transport.tls.certFile = "/etc/frp/certs/server.crt"
# transport.tls.keyFile = "/etc/frp/certs/server.key"
# transport.tls.trustedCaFile = "/etc/frp/certs/ca.crt"

# ------------------------------------------------------------------------------
# 三、虚拟主机 (vhost)
# ------------------------------------------------------------------------------
# 说明: 下面两个端口供 frpc 的 http/https 类型代理做「按域名路由」。
# 本仓库用的是 TCP 类型代理（frpc 用 remote_port 映射端口，再由 nginx 反代），
# 故保持禁用。若确实要启用，务必避开服务器上 nginx 已占用的 80/443，否则 frps 起不来。

# HTTP 类型代理监听的端口，启用后才能支持 HTTP 类型的代理。作用域: 全局 | 默认值: 0（禁用）
# vhostHTTPPort = 8880

# HTTPS 类型代理监听的端口，启用后才能支持 HTTPS 类型的代理。作用域: 全局 | 默认值: 0（禁用）
# vhostHTTPSPort = 8443

# HTTP 类型代理在服务端的响应头超时时间，单位秒。作用域: 全局 | 默认值: 60
# 取 60: 跟随官方默认。本仓库未启用 vhost，此项当前无效，保留是为了将来启用时不必再查默认值。
vhostHTTPTimeout = 60

# ------------------------------------------------------------------------------
# 四、TCPMUX
# ------------------------------------------------------------------------------

# tcpmux 类型且复用器为 httpconnect 的代理监听端口。作用域: 全局 | 默认值: 0（禁用）
# 取 0: 本仓库不使用 tcpmux，显式写出默认值，避免被误读成「没配置」。
tcpmuxHTTPConnectPort = 0

# 对 tcpmux 类型的代理是否透传 CONNECT 请求。作用域: 全局 | 默认值: false
# 取 false: 仅在上面的端口启用时才有意义，保持官方默认。
tcpmuxPassthrough = false

# ------------------------------------------------------------------------------
# 五、Dashboard 与监控 (webServer)
# ------------------------------------------------------------------------------

# Dashboard / API 的监听地址。作用域: 全局 | 默认值: "127.0.0.1"
# 取 127.0.0.1: 只管回环。本仓库 compose 用 network_mode: host，故这是「服务器本机的回环」，
# 外网访问不到 Dashboard；需要时用 SSH 隧道即可。
# 若要开放到公网，改成 0.0.0.0 之前务必先换掉下面的弱口令，并考虑再加一层 HTTPS。
webServer.addr = "127.0.0.1"

# Dashboard / API 的监听端口。作用域: 全局 | 默认值: 0（不启动）
# 取 7500: 官方示例端口，且与下面 allowPorts 放行的 7501 相邻、便于记忆。
webServer.port = 7500

# Dashboard 的 HTTP BasicAuth 用户名。作用域: 全局 | 默认值: 空（即不鉴权）
# 取 admin: 官方示例的占位值，部署时替换。
webServer.user = "admin"

# Dashboard 的 HTTP BasicAuth 密码。作用域: 全局 | 默认值: 空（即不鉴权）
# 取 admin: 官方示例的占位值，部署时替换。这是本文件里最该优先更换的值 ——
# Dashboard 能看到并管理所有隧道与客户端。
webServer.password = "admin"

# Dashboard 自身的 TLS 证书与私钥。作用域: 全局 | 默认值: 空
# 本仓库不为 Dashboard 配 TLS（它只监听回环，由 SSH 隧道保护），故保持注释。
# webServer.tls.certFile = "/etc/frp/certs/dashboard.crt"
# webServer.tls.keyFile = "/etc/frp/certs/dashboard.key"

# 自定义静态资源目录。作用域: 全局 | 默认值: 空（使用二进制内嵌资源）
# 只有调试 Dashboard 前端时才需要，故保持注释。
# webServer.assetsDir = ""

# 是否在 Dashboard 端口上暴露 Go pprof 调试接口。作用域: 全局 | 默认值: false
# 取 false: pprof 会泄露运行时细节，只在排障时临时打开。
webServer.pprofEnable = false

# 是否在 Dashboard 端口上提供 Prometheus 指标（/metrics）。作用域: 全局 | 默认值: false
# 取 false: 需要先启用 webServer.port；本仓库没有 Prometheus 采集端，先关着。
enablePrometheus = false

# ------------------------------------------------------------------------------
# 六、日志
# ------------------------------------------------------------------------------

# 日志输出目标。"console" 打印到标准输出，其余视为文件路径。作用域: 全局 | 默认值: "console"
# 取 /etc/frp/log/frps.log: 与 docker-compose.yml 里 ./logs:/etc/frp/log 的挂载对应，
# 日志落在宿主机磁盘上，容器重建也不会丢。
# 注意: 这是宿主机上的真实文件，compose 的 json-file 轮转管不到它，需自行配置 logrotate。
log.to = "/etc/frp/log/frps.log"

# 日志级别: trace / debug / info / warn / error。作用域: 全局 | 默认值: "info"
# 取 info: 日常够用且量可控；排障时临时改成 debug 或 trace。
log.level = "info"

# 日志保留天数。作用域: 全局 | 默认值: 3
# 取 7: 留一周，便于回溯偶发问题。
log.maxDays = 7

# 日志是否使用彩色输出（仅当 log.to = "console" 时生效）。作用域: 全局 | 默认值: false
# 取 false: 日志要落盘，颜色转义码只会污染文件。
log.disablePrintColor = false

# ------------------------------------------------------------------------------
# 七、代理行为
# ------------------------------------------------------------------------------

# 是否把具体错误信息（含调试细节）返回给 frpc。作用域: 全局 | 默认值: true
# 取 true: 便于排查 frpc 侧的配置错误；隧道仅对已通过鉴权的客户端开放，无外泄风险。
detailedErrorsToClient = true

# ------------------------------------------------------------------------------
# 八、鉴权 (auth)
# ------------------------------------------------------------------------------

# 鉴权方式: token / oidc。作用域: 全局 | 默认值: "token"
# 取 token: 本仓库用共享 token 的简单方式；oidc 需要额外的身份提供方，未启用。
auth.method = "token"

# 除登录外，在哪些环节附带鉴权信息。可选: HeartBeats / NewWorkConns。作用域: 全局 | 默认值: 空
# 取两者全开: 让服务端在心跳与每个新建工作连接上都能逐条校验，防止有人劫持/复用
# 已建立的隧道连接（代价是 token 传输频次略增）。
auth.additionalScopes = ["HeartBeats", "NewWorkConns"]

# frpc 用来通过鉴权的 token，必须与 frpc 的 auth.token 完全一致。作用域: 全局 | 默认值: 空
# 取值说明: 这里是占位值，部署时必须替换成一段随机字符串，生成方式例如
#   openssl rand -hex 32
#   head -c 32 /dev/urandom | base64
# 该值等同隧道的门钥匙: 不要写进版本库、不要复用其它系统的密码。
auth.token = "12345678"

# ------------------------------------------------------------------------------
# 九、连接与端口限制
# ------------------------------------------------------------------------------

# 访客连上被映射端口后，等待 frpc 侧响应的超时时间，单位秒。作用域: 全局 | 默认值: 10
# 取 10: 跟随官方默认；超出即断开，避免空连接占住端口。
userConnTimeout = 10

# 允许 frpc 绑定的服务端端口范围。作用域: 全局 | 默认值: 空（不限制）
# 取 { single = 7501 }: 示例只放行一个端口，与上面的 webServer.port = 7500 相邻。
# 部署时按需改成自己的映射端口或区间，例如 { start = 7501, end = 7510 }。
# 注意: 留空表示不限制，任何客户端都能占用服务器端口，公网服务端务必写明范围。
allowPorts = [
  # { start = 2000, end = 3000 },
  { single = 7501 },
]

# 单个客户端最多能同时存在多少个代理。作用域: 全局 | 默认值: 0（不限制）
# 取 100: 留一个宽松上限，防止单个客户端失控占满 allowPorts。
maxPortsPerClient = 100

# ------------------------------------------------------------------------------
# 十、二级域名与错误页
# ------------------------------------------------------------------------------

# 二级域名后缀，仅当 frpc 用 http/https 类型代理并设置 subdomain 时生效。作用域: 全局 | 默认值: 空
# 本仓库未启用 vhost，故保持注释。
# subDomainHost = "example.com"

# vhost HTTP 请求的自定义 404 页面路径。作用域: 全局 | 默认值: 空（使用内置页面）
# 本仓库未启用 vhost，故保持注释。
# custom404Page = "/etc/frp/404.html"

# ------------------------------------------------------------------------------
# 十一、UDP 与打洞
# ------------------------------------------------------------------------------

# UDP 代理支持的最大包长度，单位字节。作用域: 全局 | 默认值: 1500
# 取 1500: 与常见以太网 MTU 对齐；服务端与 frpc 必须一致，否则 UDP 转发会失败。
udpPacketSize = 1500

# 打洞（XTCP）策略数据的保留时间，单位小时。作用域: 全局 | 默认值: 168（7 天）
# 取 168: 跟随官方默认。
natholeAnalysisDataReserveHours = 168

# ------------------------------------------------------------------------------
# 十二、SSH 隧道网关（可选功能）
# ------------------------------------------------------------------------------
# 作用: 让用户用 ssh -R 直接建隧道，无需在对方机器上安装 frpc。
# 本仓库未启用；若要启用，bindPort 为必填（其余可省），并须在防火墙放行该端口。

# SSH 服务器监听端口。作用域: 全局 | 默认值: 0（禁用；大于 0 即启用）
# sshTunnelGateway.bindPort = 2200

# SSH 服务器私钥文件路径。留空则读取下面 autoGenPrivateKeyPath 指向的文件。
# sshTunnelGateway.privateKeyFile = ""

# 私钥自动生成路径（文件不存在或内容为空时 frps 会自动生成 RSA 私钥）。作用域: 全局 | 默认值: "./.autogen_ssh_key"
# 注意: 该路径若落在容器可写层，容器重建即重置；启用本功能时应挂载出来持久化。
# sshTunnelGateway.autoGenPrivateKeyPath = ""

# SSH 客户端授权公钥文件路径。留空则不校验客户端（任何人都能建隧道）；非空可实现免密鉴权。
# sshTunnelGateway.authorizedKeysFile = ""

# ------------------------------------------------------------------------------
# 十三、HTTP 插件（高级功能）
# ------------------------------------------------------------------------------
# 作用: 在「登录」「新建代理」等时机回调你自建的 HTTP 服务，实现自定义管控。
# 本仓库未启用；启用时按下面形式追加（可多条）:
#   [[httpPlugins]]
#   name = "user-manager"
#   addr = "127.0.0.1:9000"
#   path = "/handler"
#   ops = ["Login"]
#   tlsVerify = true
# httpPlugins = []
