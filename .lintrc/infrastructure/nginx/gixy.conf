# gixy 配置 —— nginx 配置安全检查（最严格档）
# 文档：https://github.com/yandex/gixy
# 用法：gixy -c .lintrc/infrastructure/nginx/gixy.conf --disable-includes \
#         nginx.conf conf.d/*.conf conf.d/sites/*.conf conf.d/snippets/*.conf
#
# 调用纪律（两条硬规则，违反了会静默出错）：
#   · 位置参数只能是「文件」。gixy 对每个参数直接 open(path,'rb')，传目录会抛错并让整个
#     进程以非 0 退出（前面文件的审计结果也一起丢）——所以目录必须写成 shell glob，
#     由调用方的 shell 展开（bash 下写 conf.d/sites/*.conf），不要加引号。
#   · gixy 只在「恰好 1 个位置参数」时才校验文件是否存在。多参数时缺文件只打一行
#     LOG.error('File %s was not found') 然后 continue，退出码仍是 0 —— 因此调用方
#     （CI 的 Check gixy targets 步骤）必须先断言每个 glob 至少命中一个文件，
#     否则改名或改布局会让覆盖范围静默缩小而 CI 依旧全绿。
#
# --disable-includes：本仓库的 include 全是 /etc/nginx/... 绝对路径，而仓库在容器里挂在
#   /repo，include 链永远解析不到，gixy 只会打 4 行 "File not found" 告警（不影响退出码），
#   实际效果是「逐文件独立审计」。用该开关把这件事写成显式意图，而不是让告警被当噪声忽略；
#   若将来改成把仓库挂到 /etc/nginx 让 include 真正生效，请删掉这个开关。
#
# 严重度：不要写 -l/--level。gixy 的档位顺序是 未指定 < 低 < 中 < 高，默认 level 0 已经是
#   最低档（等于全部上报）；-l 会把低危过滤掉，那是放宽而不是收紧。
#
# 格式（由 gixy 的 GixyConfigParser 决定）：
#   · 行式 `key = value`；只写 `key` 等价于 true；注释用 # 或 ;
#   · 段名 [plugin] 展开成前缀：段名里的 `_` 会变成 `-`，最终键名 = "段名-键名"
#   · 值不能为空（分隔符后至少 1 个字符）；列表用逗号分隔，不要写方括号
#   · 未知键会让 configargparse 直接报错（不会静默忽略）
#
# 「8 个插件全部启用」= 不写 skips（gixy 默认就不跳过任何插件，因此这里刻意不写）

[origins]
# 只接受 https 来源的 referer / origin（默认 https? 会放行 http）
https-only = true
# 严格白名单：把 * 换成自己站点的域名后，插件才会启用「仅可信域名」校验（逗号分隔）
domains = *

[add_header_redefinition]
# 默认只盯 5 个头；这里把其余安全响应头也纳入「父级 add_header 被覆盖」检测
headers = x-frame-options, x-content-type-options, x-xss-protection, content-security-policy, cache-control, strict-transport-security, referrer-policy, permissions-policy
